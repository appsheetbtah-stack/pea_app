<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข้อมูลผู้ใช้ไฟฟ้า - PEA</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1923">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1923; --surface:#162030; --surface2:#1e2d3d; --border:#2a3f55;
  --accent:#f5a623; --accent2:#e05c2a; --blue:#3b9ede; --green:#2ecc71; --red:#e74c3c;
  --yellow:#f39c12; --text:#e8f0f8; --text2:#a9bdd1;
  --mono:'IBM Plex Mono',monospace; --sans:'Sarabun',sans-serif;
  --topbar:52px; --botnav:56px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; }

/* ── TOPBAR ── */
.topbar {
  position:fixed; top:0; left:0; right:0; height:var(--topbar); z-index:600;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px; padding:0 16px;
}
.back-btn {
  color:var(--text2); text-decoration:none; font-size:13px;
  display:flex; align-items:center; gap:4px;
  padding:6px 10px; border:1px solid var(--border); border-radius:6px;
  flex-shrink:0; transition:color .15s;
}
.back-btn:hover { color:var(--accent); border-color:var(--accent); }
.topbar-title { font-size:15px; font-weight:700; flex:1; text-align:center; }
.fb-dot { width:8px; height:8px; border-radius:50%; background:var(--yellow); flex-shrink:0; }
.topbar-badge {
  font-family:var(--mono); font-size:13px; color:var(--text2);
  background:var(--surface2); padding:3px 8px; border-radius:10px; flex-shrink:0;
}
#settings-btn { text-decoration:none; font-size:16px; padding:5px 9px; cursor:pointer; }

/* ── TAB CONTENT ── */
.tab-pane {
  position:fixed; top:var(--topbar); left:0; right:0; bottom:var(--botnav);
  overflow-y:auto; display:none;
}
.tab-pane.active { display:block; }
.tab-pane.map-pane { display:none; overflow:hidden; flex-direction:column; }
.tab-pane.map-pane.active { display:flex; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; height:var(--botnav); z-index:600;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex;
}
.nav-btn {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; color:var(--text2);
  cursor:pointer; font-family:var(--sans); transition:color .15s; padding:0;
  position:relative;
}
.nav-btn.active { color:var(--accent); }
.nav-btn.active::after {
  content:''; position:absolute; top:0; left:20%; right:20%; height:2px;
  background:var(--accent); border-radius:0 0 2px 2px;
}
.nav-icon-wrap { position:relative; display:inline-block; }
.nav-icon { font-size:20px; line-height:1; }
.nav-label { font-size:13px; font-weight:600; }
.nav-badge {
  position:absolute; top:-4px; right:-10px; background:var(--red); color:#fff;
  font-size:10px; font-family:var(--mono); font-weight:700; border-radius:9px; padding:0 5px;
  min-width:16px; text-align:center; line-height:16px;
}

/* ── DASHBOARD ── */
.db-wrap { padding:14px 14px 20px; display:flex; flex-direction:column; gap:14px; }
.stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.stat-card {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; position:relative; overflow:hidden; cursor:pointer;
  transition:transform .12s ease, border-color .12s ease;
}
.stat-card:active { transform:scale(0.97); }
.stat-card.orange:hover, .stat-card-type:hover { border-color:var(--card-accent, var(--accent)); }
.stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
.stat-card.orange::before { background:var(--accent); }
.stat-card.blue::before { background:var(--blue); }
.stat-card.green::before { background:var(--green); }
.stat-card.red::before { background:var(--red); }
.stat-card-type::before { background:var(--card-accent, var(--accent)); }
.stat-label { font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:0.7px; margin-bottom:8px; line-height:1.4; }
.stat-value { font-family:var(--mono); font-size:24px; font-weight:600; color:var(--text); line-height:1; }
.stat-unit { font-size:13px; color:var(--text2); margin-top:5px; }

.mt-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
.mt-cards-slot { display:contents; }
.stat-card-type .stat-label { display:flex; align-items:center; gap:6px; }
.stat-card-type .mt-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }

.meter-filter-chip {
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--accent);
  color:var(--text); font-size:13px; padding:6px 12px; border-radius:20px; width:fit-content; margin:6px 0;
}
.meter-filter-chip .chip-x {
  cursor:pointer; color:var(--text2); font-size:12px; line-height:1; padding:2px 4px; border-radius:50%;
}
.meter-filter-chip .chip-x:hover { color:var(--red); background:rgba(255,255,255,0.08); }

.charts-row { display:flex; flex-direction:column; gap:10px; }
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
.chart-title { font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.7px; margin-bottom:12px; }
.pie-wrap { display:flex; align-items:center; gap:16px; }
.pie-circle-wrap { position:relative; width:96px; height:96px; flex-shrink:0; }
.pie-circle { width:100%; height:100%; border-radius:50%; }
.pie-circle-hole {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:58%; height:58%; border-radius:50%; background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; color:var(--text2); text-align:center; line-height:1.2;
}
.pie-legend { flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
.pie-legend-item { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text2); }
.pie-legend-dot { width:9px; height:9px; border-radius:2px; flex-shrink:0; }
.pie-legend-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pie-legend-value { font-family:var(--mono); font-size:11.5px; color:var(--text); white-space:nowrap; }

/* ── SEARCH ── */
.search-wrap { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
.search-bar-wrap { display:flex; gap:8px; }
.search-input {
  flex:1; background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:11px 14px; color:var(--text);
  font-family:var(--sans); font-size:14px; outline:none; transition:border-color .15s;
}
.search-input:focus { border-color:var(--accent); }
.search-input::placeholder { color:var(--text2); }
.btn {
  padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
  font-family:var(--sans); font-size:14px; font-weight:600; transition:all .15s;
  white-space:nowrap;
}
.btn-primary { background:var(--accent); color:#000; }
.btn-primary:hover { background:#e09010; }
.btn-danger { background:var(--red); color:#fff; }
.btn-danger:hover { background:#c0392b; }
.btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover { background:var(--border); }
.btn-ghost.active-filter { border-color:var(--green); background:rgba(46,204,113,0.12); color:var(--green); }
.btn-blue { background:var(--blue); color:#fff; }
.btn-blue:hover { background:#2980b9; }
.results-info { font-size:13px; color:var(--text2); font-family:var(--mono); }

.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:8px; border:1px solid var(--border); }
table { width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
th {
  background:var(--surface2); color:var(--text2); text-align:left;
  padding:9px 12px; font-weight:600; font-size:13px;
  text-transform:uppercase; letter-spacing:0.7px; border-bottom:1px solid var(--border);
  white-space:nowrap;
}
td { padding:9px 12px; border-bottom:1px solid rgba(42,63,85,0.5); color:var(--text); }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--surface2); }
.badge { display:inline-block; padding:2px 8px; border-radius:3px; font-size:13px; font-family:var(--mono); font-weight:500; }
.badge-normal { background:rgba(46,204,113,0.15); color:var(--green); }
.badge-emete { background:rgba(59,158,222,0.15); color:var(--blue); }
.badge-demand { background:rgba(245,166,35,0.15); color:var(--accent); }
.badge-tou { background:rgba(224,92,42,0.15); color:var(--accent2); }
.badge-ami { background:rgba(150,100,200,0.15); color:#a06ac4; }
.badge-other { background:rgba(138,160,184,0.15); color:var(--text2); }
.action-btn {
  padding:5px 12px; border-radius:6px; border:none; cursor:pointer;
  font-size:13px; font-family:var(--sans); font-weight:600;
  background:rgba(245,166,35,0.15); color:var(--accent); transition:all .15s;
}
.action-btn:hover { background:var(--accent); color:#000; }

.pagination { display:flex; align-items:center; gap:4px; justify-content:center; flex-wrap:wrap; }
.page-btn {
  padding:6px 10px; border-radius:6px; border:1px solid var(--border);
  background:var(--surface); color:var(--text2); cursor:pointer; font-size:13px; transition:all .15s;
  min-width:34px; text-align:center;
}
.page-btn:hover, .page-btn.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
.page-btn:disabled { opacity:0.3; cursor:default; }
.page-info { font-size:13px; color:var(--text2); font-family:var(--mono); }

/* ── MODAL ── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
  z-index:1000; align-items:flex-end; justify-content:center; padding:0;
}
.modal-overlay.show { display:flex; }
.modal {
  background:var(--surface); border:1px solid var(--border); border-radius:12px 12px 0 0;
  width:100%; max-width:560px; max-height:85vh; overflow-y:auto;
}
.modal-header {
  padding:16px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; background:var(--surface); z-index:1;
}
.modal-title { font-size:15px; font-weight:700; }
.modal-close { background:none; border:none; color:var(--text2); font-size:24px; cursor:pointer; line-height:1; padding:2px 6px; }
.modal-close:hover { color:var(--text); }
.modal-body { padding:18px; }
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.info-key { font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:0.7px; margin-bottom:4px; }
.info-val { font-size:13.5px; color:var(--text); font-weight:500; }
.info-val.mono { font-family:var(--mono); color:var(--accent); }
.map-mini { height:180px; border-radius:8px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border); }
.modal-actions { display:flex; gap:8px; flex-wrap:wrap; }
.col-span-2 { grid-column:1 / -1; }

/* ── TICKET ── */
.ticket-wrap { padding:14px; display:flex; flex-direction:column; gap:16px; }
.ticket-form { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
.form-title { font-size:14px; font-weight:700; margin-bottom:14px; color:var(--accent); }
.form-row { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:10px; }
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-label { font-size:13px; color:var(--text2); text-transform:uppercase; letter-spacing:0.7px; }
.form-control {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px; color:var(--text);
  font-family:var(--sans); font-size:14px; outline:none; -webkit-appearance:none;
}
.form-control:focus { border-color:var(--accent); }
textarea.form-control { resize:vertical; min-height:70px; }
.mode-btn {
  flex:1; border:1px solid var(--border); background:var(--surface2); color:var(--text2);
  font-family:var(--sans); font-size:13px; font-weight:600; padding:10px 8px;
  border-radius:9px; cursor:pointer; transition:all .15s ease;
}
.mode-btn.active { border-color:var(--accent); background:rgba(245,166,35,0.12); color:var(--accent); }
.loc-method-btn {
  border:1px solid var(--border); background:var(--surface2); color:var(--text2);
  font-family:var(--sans); font-size:13px; font-weight:600; padding:8px 12px;
  border-radius:20px; cursor:pointer; transition:all .15s ease;
}
.loc-method-btn.active { border-color:var(--blue); background:rgba(59,158,222,0.12); color:var(--blue); }

.ticket-list-title { font-size:13px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.8px; }
.ticket-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.ticket-status-dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex-shrink:0; }
.dot-open { background:var(--red); box-shadow:0 0 6px var(--red); }
.dot-progress { background:var(--yellow); box-shadow:0 0 6px var(--yellow); }
.dot-done { background:var(--green); }
.ticket-info { flex:1; min-width:0; }
.ticket-id { font-family:var(--mono); font-size:13px; color:var(--text2); margin-bottom:4px; }
.ticket-name { font-size:14px; font-weight:600; margin-bottom:3px; }
.ticket-addr { font-size:13px; color:var(--text2); margin-bottom:6px; }
.ticket-note { font-size:13px; color:var(--text); background:var(--surface2); padding:8px 10px; border-radius:6px; margin-bottom:8px; }
.ticket-meta { display:flex; gap:8px; font-size:13px; color:var(--text2); font-family:var(--mono); flex-wrap:wrap; }
.ticket-actions { display:flex; flex-direction:row; align-items:center; gap:8px; width:100%; }
.ticket-card-top { display:flex; align-items:flex-start; gap:12px; }
.empty-state { text-align:center; padding:50px 20px; color:var(--text2); }
.empty-icon { font-size:44px; margin-bottom:12px; }
.empty-text { font-size:14px; }

/* ── MAP ── */
.map-topbar-controls { padding:10px 14px 6px; }
#map-full { flex:1; }
.map-controls { display:flex; gap:8px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
.map-controls .btn { padding:8px 12px; font-size:13px; }
.map-legend { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:4px; font-size:13px; color:var(--text2); }
.legend-item { display:flex; align-items:center; gap:6px; }
.legend-dot { width:10px; height:10px; border-radius:50%; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:calc(var(--botnav) + 10px); left:50%; transform:translateX(-50%) translateY(80px);
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:11px 18px; font-size:13px;
  opacity:0; transition:all .3s; z-index:9999;
  white-space:nowrap; max-width:calc(100vw - 32px); text-align:center;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.success { border-color:var(--green); background:rgba(46,204,113,0.15); }
.toast.error { border-color:var(--red); background:rgba(231,76,60,0.15); }

.highlight { background:rgba(245,166,35,0.3); color:var(--accent); border-radius:2px; padding:0 1px; }
</style>
</head>

<script src="data.js"></script>
<script>
let searchResults = [];
let currentPage = 1;
const PAGE_SIZE = 20;
let tickets = [];
let ticketCounter = 1;
let mapFull = null;
let userLayer = null;
let userLayerVisible = true;

// ======= INIT =======
function saveTickets() {
  try { localStorage.setItem('pea_tickets', JSON.stringify(tickets)); localStorage.setItem('pea_ticket_counter', ticketCounter); } catch(e) {}
}
function loadTickets() {
  try {
    const saved = localStorage.getItem('pea_tickets');
    const counter = localStorage.getItem('pea_ticket_counter');
    if(saved) tickets = JSON.parse(saved);
    if(counter) ticketCounter = parseInt(counter);
  } catch(e) { tickets = []; }
}

// ======= FIRESTORE HELPERS =======
async function fsAddTicket(ticket) {
  if(!window._firebaseReady) return;
  const { collection, addDoc } = window._fsLib;
  const db = window._db;
  try {
    await addDoc(collection(db, "tickets"), { ...ticket, createdAt: Date.now() });
  } catch(e) { console.error("Firestore add error:", e); showToast('⚠️ บันทึก Firestore ล้มเหลว (ข้อมูลยังอยู่ใน localStorage)', 'error'); }
}
async function fsUpdateTicketStatus(docId, status) {
  if(!window._firebaseReady || !docId) return;
  const { doc, updateDoc } = window._fsLib;
  const db = window._db;
  try { await updateDoc(doc(db, "tickets", docId), { status }); } catch(e) { console.error("Firestore update error:", e); }
}
async function fsDeleteTicket(docId) {
  if(!window._firebaseReady || !docId) return;
  const { doc, deleteDoc } = window._fsLib;
  const db = window._db;
  try { await deleteDoc(doc(db, "tickets", docId)); } catch(e) { console.error("Firestore delete error:", e); }
}

window.addEventListener('DOMContentLoaded', () => {
  loadTickets();
  document.getElementById('total-badge').textContent = ALL_RECORDS.length.toLocaleString() + ' รายการ';
  initDashboard();
});

function initDashboard() { initStats(); }
function initStats() {
  document.getElementById('stat-total').textContent = ALL_RECORDS.length.toLocaleString();

  const mtCount = {};
  ALL_RECORDS.forEach(r => {
    if(!r.METERTYPE) return;
    const key = r.METERTYPE === 'E-METE' ? 'E-METER' : r.METERTYPE; // fix data typo: E-METE == E-METER
    mtCount[key] = (mtCount[key]||0)+1;
  });
  const mtSorted = Object.entries(mtCount).sort((a,b)=>b[1]-a[1]);
  renderPieChart('chart-metertype', mtSorted);
  renderMeterTypeCards(mtSorted);

  const cwCount = {};
  ALL_RECORDS.forEach(r => { if(r.CHANGWAT) cwCount[r.CHANGWAT] = (cwCount[r.CHANGWAT]||0)+1; });
  const cwSorted = Object.entries(cwCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  renderPieChart('chart-changwat', cwSorted);
}

const PIE_COLORS = ['#f5a623','#3b9ede','#2ecc71','#e74c3c','#a06ac4','#e05c2a','#f39c12','#1abc9c'];

function renderPieChart(containerId, entries) {
  const total = entries.reduce((s,[,v]) => s+v, 0) || 1;
  let acc = 0;
  const stops = entries.map(([k,v], i) => {
    const startDeg = (acc/total*360).toFixed(2);
    acc += v;
    const endDeg = (acc/total*360).toFixed(2);
    const color = PIE_COLORS[i % PIE_COLORS.length];
    return color+' '+startDeg+'deg '+endDeg+'deg';
  }).join(', ');

  const legend = entries.map(([k,v], i) => {
    const color = PIE_COLORS[i % PIE_COLORS.length];
    const pct = (v/total*100).toFixed(1);
    const label = k || '(ไม่ระบุ)';
    return '<div class="pie-legend-item">' +
      '<span class="pie-legend-dot" style="background:'+color+'"></span>' +
      '<span class="pie-legend-label" title="'+label+'">'+label+'</span>' +
      '<span class="pie-legend-value">'+v.toLocaleString()+' ('+pct+'%)</span>' +
    '</div>';
  }).join('');

  document.getElementById(containerId).innerHTML =
    '<div class="pie-wrap">' +
      '<div class="pie-circle-wrap">' +
        '<div class="pie-circle" style="background:conic-gradient('+stops+')"></div>' +
        '<div class="pie-circle-hole">'+total.toLocaleString()+'</div>' +
      '</div>' +
      '<div class="pie-legend">'+legend+'</div>' +
    '</div>';
}

function renderMeterTypeCards(entries) {
  const el = document.getElementById('mt-cards');
  if(!el) return;
  const total = entries.reduce((s,[,v]) => s+v, 0) || 1;
  el.innerHTML = entries.map(([k,v], i) => {
    const color = PIE_COLORS[i % PIE_COLORS.length];
    const label = k || '(ไม่ระบุ)';
    const pct = (v/total*100).toFixed(1);
    return '<div class="stat-card stat-card-type" style="--card-accent:'+color+'" data-meter-type="'+k+'">' +
      '<div class="stat-label"><span class="mt-dot" style="background:'+color+'"></span>'+label+'</div>' +
      '<div class="stat-value">'+v.toLocaleString()+'</div>' +
      '<div class="stat-unit">เครื่อง ('+pct+'%)</div>' +
    '</div>';
  }).join('');
  el.querySelectorAll('.stat-card-type').forEach(card => {
    card.addEventListener('click', () => filterByMeterType(card.dataset.meterType));
  });
}

// ======= TAB SWITCHING =======
let currentTab = 'dashboard';
function switchTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pane-' + tab).classList.add('active');
  document.getElementById('btn-tab-' + tab).classList.add('active');
  currentTab = tab;
  if(tab === 'map') {
    setTimeout(() => { initMap(); if(mapFull) mapFull.invalidateSize(); }, 100);
  }
}

// ======= SEARCH =======
let activeMeterFilter = null; // null = no filter applied yet, 'ALL' = show all users, or a specific METERTYPE
function normMeterType(t) { return t === 'E-METE' ? 'E-METER' : t; }

function filterByMeterType(type) {
  activeMeterFilter = type === null ? 'ALL' : type;
  document.getElementById('search-input').value = '';
  switchTab('search');
  doSearch();
  document.getElementById('search-input').focus();
}

function clearMeterFilter() {
  activeMeterFilter = null;
  doSearch();
}

function renderFilterChip() {
  const el = document.getElementById('meter-filter-chip');
  if(!el) return;
  if(!activeMeterFilter || activeMeterFilter === 'ALL') { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  el.innerHTML = 'ตัวกรองมิเตอร์: <b>' + activeMeterFilter + '</b>' +
    '<span class="chip-x" onclick="clearMeterFilter()">✕</span>';
}

function doSearch() {
  const raw = document.getElementById('search-input').value.trim().toLowerCase();
  const terms = raw.split(/\s+/).filter(Boolean);
  let base = ALL_RECORDS;
  if(activeMeterFilter && activeMeterFilter !== 'ALL') {
    base = base.filter(r => normMeterType(r.METERTYPE) === activeMeterFilter);
  }
  if(!terms.length) {
    searchResults = activeMeterFilter ? base : [];
  } else {
    searchResults = base.filter(r => {
      const haystack = [
        r.CA, r.PEANO, r.CUSTOMERNAME, r.CUSTOMERSIRNAME,
        r.TUMBOL, r.AMPHOE, r.MOBILE_NO, r.ADDRESSNO
      ].map(v => (v+'').toLowerCase());
      return terms.every(term => haystack.some(field => field.includes(term)));
    });
  }
  currentPage = 1;
  renderFilterChip();
  renderTable();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  activeMeterFilter = null;
  searchResults = [];
  renderFilterChip();
  renderTable();
}

function hl(text, q) {
  if(!q || !text) return text||'';
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return (text+'').replace(re, '<span class="highlight">$1</span>');
}

function meterBadge(t) {
  const map = {'NORMAL':'badge-normal','E-METE':'badge-emete','E-METER':'badge-emete','DEMAND':'badge-demand','TOU':'badge-tou','AMI':'badge-ami','AMR':'badge-ami'};
  return `<span class="badge ${map[t]||'badge-other'}">${t||'—'}</span>`;
}

function renderTable() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const body = document.getElementById('search-body');
  if(!searchResults.length) {
    body.innerHTML = '';
    document.getElementById('results-info').textContent = (q || activeMeterFilter) ? '❌ ไม่พบข้อมูลที่ตรงกัน' : '— ใส่คำค้นหาเพื่อเริ่มต้น';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  const total = searchResults.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const start = (currentPage-1)*PAGE_SIZE;
  const rows = searchResults.slice(start, start+PAGE_SIZE);
  document.getElementById('results-info').textContent = `พบ ${total.toLocaleString()} รายการ · หน้า ${currentPage}/${totalPages}`;
  body.innerHTML = rows.map(r => {
    const name = `${r.PREFIX||''} ${r.CUSTOMERNAME||''} ${r.CUSTOMERSIRNAME||''}`.trim();
    const addr = [r.ADDRESSNO, r.MOO ? 'ม.'+r.MOO : ''].filter(Boolean).join(' ');
    const loc = [r.TUMBOL, r.AMPHOE].filter(Boolean).join(' ');
    return `<tr>
      <td><span style="font-family:var(--mono);font-size:13px;color:var(--accent)">${hl(r.CA,q)}</span></td>
      <td><span style="font-family:var(--mono);font-size:13px;color:var(--blue)">${hl(r.PEANO||'—',q)}</span></td>
      <td>${hl(name,q)}</td>
      <td style="color:var(--text2)">${hl(addr,q)}</td>
      <td style="color:var(--text2)">${hl(loc,q)}</td>
      <td><span style="font-family:var(--mono);font-size:13px">${hl(r.MOBILE_NO||'—',q)}</span></td>
      <td>${meterBadge(r.METERTYPE)}</td>
      <td><button class="action-btn" onclick='openUserModal(${JSON.stringify(r)})'>ดูข้อมูล</button></td>
    </tr>`;
  }).join('');

  const pg = document.getElementById('pagination');
  let phtml = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
  const range = 2;
  for(let i=1;i<=totalPages;i++) {
    if(i===1||i===totalPages||Math.abs(i-currentPage)<=range) {
      phtml += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    } else if(Math.abs(i-currentPage)===range+1) {
      phtml += `<span class="page-info">…</span>`;
    }
  }
  phtml += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
  pg.innerHTML = phtml;
}

function goPage(p) {
  const total = Math.ceil(searchResults.length/PAGE_SIZE);
  if(p<1||p>total) return;
  currentPage = p;
  renderTable();
  document.getElementById('search-table').scrollIntoView({behavior:'smooth',block:'start'});
}

// ======= MODAL =======
let modalUser = null;
let modalMiniMap = null;

function openUserModal(r) {
  modalUser = r;
  const name = `${r.PREFIX||''} ${r.CUSTOMERNAME||''} ${r.CUSTOMERSIRNAME||''}`.trim();
  const addr = [r.ADDRESSNO, r.MOO?'ม.'+r.MOO:'', r.TUMBOL, r.AMPHOE, r.CHANGWAT].filter(Boolean).join(' ');
  document.getElementById('modal-info').innerHTML = `
    <div class="info-item"><div class="info-key">CA</div><div class="info-val mono">${r.CA}</div></div>
    <div class="info-item"><div class="info-key">PEANO</div><div class="info-val mono">${r.PEANO||'—'}</div></div>
    <div class="info-item"><div class="info-key">ชื่อ-นามสกุล</div><div class="info-val">${name}</div></div>
    <div class="info-item"><div class="info-key">เบอร์โทร</div><div class="info-val mono">${r.MOBILE_NO||'—'}</div></div>
    <div class="info-item col-span-2"><div class="info-key">ที่อยู่</div><div class="info-val">${addr}</div></div>
    <div class="info-item"><div class="info-key">ประเภทมิเตอร์</div><div class="info-val">${r.METERTYPE||'—'}</div></div>
    <div class="info-item"><div class="info-key">ขนาดมิเตอร์ (พิกัดฐาน)</div><div class="info-val">${r.AMPFROMCIS ? r.AMPFROMCIS + 'A' + (r.METERTYPE ? ' (' + r.METERTYPE + ')' : '') : '—'}</div></div>
    <div class="info-item"><div class="info-key">พิกัด</div><div class="info-val mono" style="font-size:13px">${r.LATITUDE?.toFixed(6)||'—'}, ${r.LONGITUDE?.toFixed(6)||'—'}</div></div>
  `;
  document.getElementById('modal-map-btn').onclick = () => { closeModal('modal-user'); switchTab('map'); setTimeout(()=>{ if(mapFull) mapFull.invalidateSize(); focusMapUser(r); },350); };
  document.getElementById('modal-user').classList.add('show');
  setTimeout(()=>initMiniMap(r), 100);
}

function initMiniMap(r) {
  const el = document.getElementById('modal-map-mini');
  if(modalMiniMap) { try { modalMiniMap.remove(); } catch(e){} modalMiniMap = null; }
  el.innerHTML = '';
  if(!r.LATITUDE||!r.LONGITUDE) { el.style.display='none'; return; }
  el.style.display='block';
  modalMiniMap = L.map(el, {zoomControl:false,attributionControl:false}).setView([r.LATITUDE,r.LONGITUDE],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMiniMap);
  L.marker([r.LATITUDE,r.LONGITUDE]).addTo(modalMiniMap)
    .bindPopup(`${r.PREFIX||''} ${r.CUSTOMERNAME} ${r.CUSTOMERSIRNAME}<br>CA: ${r.CA}<br>PEANO: ${r.PEANO||'—'}`).openPopup();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
  if(modalMiniMap) { try { modalMiniMap.remove(); } catch(e){} modalMiniMap = null; }
}

function copyGoogleMaps() {
  if(!modalUser) return;
  if(!modalUser.LATITUDE || !modalUser.LONGITUDE) { showToast('⚠️ ไม่มีพิกัดผู้ใช้ไฟฟ้ารายนี้', 'error'); return; }
  const url = `https://www.google.com/maps?q=${modalUser.LATITUDE},${modalUser.LONGITUDE}`;
  navigator.clipboard.writeText(url);
  showToast('คัดลอกลิงก์ Google Maps แล้ว ✓', 'success');
}

function navigateToGoogleMaps() {
  if(!modalUser) return;
  if(!modalUser.LATITUDE || !modalUser.LONGITUDE) { showToast('⚠️ ไม่มีพิกัดผู้ใช้ไฟฟ้ารายนี้', 'error'); return; }
  const url = `https://www.google.com/maps/dir/?api=1&destination=${modalUser.LATITUDE},${modalUser.LONGITUDE}&travelmode=driving`;
  window.open(url, '_blank');
}

// ======= TICKET (แจ้งเหตุ - จัดการเต็มรูปแบบอยู่ที่ incident.html) =======
function createTicketFromModal() {
  if(!modalUser) return;
  // ส่งข้อมูล record ที่กำลังดูอยู่ทั้งก้อนไปด้วย เพื่อกันปัญหา CA เดียวกันแต่มีหลายมิเตอร์ (PEANO ต่างกัน)
  try { sessionStorage.setItem('ticketSourceRecord', JSON.stringify(modalUser)); } catch(e) {}
  window.location.href = 'incident.html?ca=' + encodeURIComponent(modalUser.CA)
    + '&peano=' + encodeURIComponent(modalUser.PEANO||'');
}

// ======= MAP =======
let myLocationMarker = null;

function locateMe() {
  if (!mapFull) return;
  if (!navigator.geolocation) {
    alert('เบราว์เซอร์นี้ไม่รองรับ GPS');
    return;
  }
  const btn = document.getElementById('btn-locate');
  const originalText = btn.textContent;
  btn.textContent = '📍 กำลังค้นหา...';
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      if (myLocationMarker) mapFull.removeLayer(myLocationMarker);

      const icon = L.divIcon({
        className: '',
        html: `<div style="width:16px;height:16px;border-radius:50%;background:#3b9ede;border:3px solid #fff;box-shadow:0 0 0 4px rgba(59,158,222,0.35);"></div>`,
        iconSize: [16,16], iconAnchor: [8,8]
      });
      myLocationMarker = L.marker([latitude, longitude], { icon, zIndexOffset: 1000 })
        .addTo(mapFull)
        .bindPopup('📍 ตำแหน่งของฉัน');
      mapFull.setView([latitude, longitude], 16);
      myLocationMarker.openPopup();

      btn.textContent = originalText;
      btn.disabled = false;
    },
    (err) => {
      btn.textContent = originalText;
      btn.disabled = false;
      if (err.code === 1) alert('กรุณาอนุญาตการเข้าถึงตำแหน่ง (GPS) ในเบราว์เซอร์');
      else alert('ไม่สามารถระบุตำแหน่งได้ กรุณาลองใหม่');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function initMap() {
  if(mapFull) return;
  mapFull = L.map('map-full').setView([16.75, 99.95], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap'}).addTo(mapFull);
  renderUserMarkers();
}

function renderUserMarkers() {
  if(userLayer) mapFull.removeLayer(userLayer);
  const all = ALL_RECORDS.filter(r=>r.LATITUDE&&r.LONGITUDE);
  const icon = L.divIcon({className:'', html:`<div style="width:8px;height:8px;border-radius:50%;background:#3b9ede;border:1.5px solid #fff;opacity:0.8"></div>`, iconSize:[8,8], iconAnchor:[4,4]});
  userLayer = L.markerClusterGroup({
    chunkedLoading: true,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    maxClusterRadius: 60
  });
  all.forEach(r => {
    userLayer.addLayer(
      L.marker([r.LATITUDE,r.LONGITUDE],{icon})
        .bindPopup(`<b>${r.PREFIX||''} ${r.CUSTOMERNAME} ${r.CUSTOMERSIRNAME}</b><br>CA: ${r.CA}<br>PEANO: ${r.PEANO||'—'}<br>${r.TUMBOL} ${r.AMPHOE}<br><button onclick='openUserModal(${JSON.stringify(r)})' style="margin-top:8px;width:100%;background:#f5a623;color:#0f1923;border:none;border-radius:6px;padding:7px 10px;font-family:Sarabun,sans-serif;font-size:13px;font-weight:700;cursor:pointer">ดูข้อมูลผู้ใช้ไฟ →</button>`)
    );
  });
  if(userLayerVisible) userLayer.addTo(mapFull);
}

function toggleLayer(type) {
  if(!mapFull) return;
  if(type==='users') {
    userLayerVisible = !userLayerVisible;
    userLayerVisible ? userLayer.addTo(mapFull) : mapFull.removeLayer(userLayer);
    document.getElementById('btn-users').textContent = `👤 ผู้ใช้ไฟฟ้า (${userLayerVisible?'แสดง':'ซ่อน'})`;
  }
}

function fitMapBounds() {
  if(!mapFull) return;
  mapFull.setView([16.75, 99.95], 11);
}

window.addEventListener('resize', () => {
  if(mapFull && document.getElementById('pane-map').classList.contains('active')) {
    mapFull.invalidateSize();
  }
});

function focusMapUser(r) {
  if(!mapFull || !r.LATITUDE) return;
  mapFull.setView([r.LATITUDE, r.LONGITUDE], 17);
  if(userLayer) {
    userLayer.eachLayer(m => {
      const ll = m.getLatLng();
      if(Math.abs(ll.lat - r.LATITUDE) < 0.00001 && Math.abs(ll.lng - r.LONGITUDE) < 0.00001) {
        if(userLayer.zoomToShowLayer) {
          userLayer.zoomToShowLayer(m, () => m.openPopup());
        } else {
          m.openPopup();
        }
      }
    });
  }
}

// ======= TOAST =======
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type?' '+type:'');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 3000);
}

document.getElementById('modal-user').addEventListener('click', function(e) {
  if(e.target===this) closeModal('modal-user');
});
</script>
