<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;
// ---------- Firebase (shared pea-system project) ----------
const firebaseConfig = {
  apiKey: "AIzaSyC7bzImCV7c89fLGhIq8OycWKQWRYdvZvE",
  authDomain: "pea-system.firebaseapp.com",
  projectId: "pea-system",
  storageBucket: "pea-system.firebasestorage.app",
  messagingSenderId: "1006235611544",
  appId: "1:1006235611544:web:a7453d71ff56748166fbed",
};
const fbApp = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}
const TEAMS_COLLECTION = "shiftScheduleTeams";

// ---------- constants ----------
const THAI_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const THAI_MONTHS_FULL = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
const THAI_DAYS_SHORT = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
const THAI_DAYS_FULL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
const SHIFT_LABELS = ["00:00 - 08:00", "08:00 - 16:00", "16:00 - 24:00"];
const WORKER_COLORS = ["#F2A93B", "#3FB88F", "#7C8CF8", "#E85D42", "#4FC3E0", "#C97BD1"];
const SSO_RATE = 0.05;

const pad2 = (n) => String(n).padStart(2, "0");
const dateKey = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const isSunday = (y, m, d) => new Date(y, m - 1, d).getDay() === 0;
const weekdayOf = (y, m, d) => new Date(y, m - 1, d).getDay();
const uid = () => Math.random().toString(36).slice(2, 9);

const ROTATION_EPOCH = new Date(2026, 0, 1);
const daysBetween = (a, b) => Math.round((b - a) / 86400000);

// ---------- default teams ----------
function defaultTeams() {
  return [
    {
      id: "outage",
      name: "ทีมแก้ไฟฯ",
      type: "rotation", // 3-shift rotating team
      workers: [
        { id: uid(), name: "นายชารี ราชอ่อง", dailyRate: 436, contractorRate: 548 },
        { id: uid(), name: "นายประเสริฐ ทิมทอง", dailyRate: 436, contractorRate: 604 },
        { id: uid(), name: "นายดนุภพ คำมาเปียง", dailyRate: 455, contractorRate: 548 },
      ],
      schedule: {}, // dateKey -> { shifts:[id,id,id], holiday:'none'|'worked'|'off' }
      docSettings: {
        companyName: "บริษัท สยามราชธานี จำกัด",
        contractNo: "จ.น2.-172/2566",
        teamName: "นายอนลัส เลี่ยมสกุล",
        siteName: "กฟส.บ้านทุ่งอ้ายโห้",
      },
    },
    {
      id: "maintenance",
      name: "ทีมซ่อมบำรุงฯ",
      type: "weekday", // simple whole-team workday/holiday
      workers: [
        { id: uid(), name: "นายสุกนต์ธี สุขแม้น", dailyRate: 407, contractorRate: 548 },
        { id: uid(), name: "นายพุฒิพงษ์ มั่นคง", dailyRate: 396, contractorRate: 488 },
        { id: uid(), name: "นายจักรพันธ์ ราชอ่อง", dailyRate: 368, contractorRate: 488 },
      ],
      schedule: {}, // dateKey -> { worked: bool (optional, default = Mon-Fri), holiday: bool }
      docSettings: {
        companyName: "บริษัท สยามราชธานี จำกัด",
        contractNo: "จ.น2.-172/2566",
        teamName: "นายชาคริต บุญม่วง",
        siteName: "กฟส.บ้านทุ่งอ้ายโห้",
      },
    },
    {
      id: "meter",
      name: "ทีมมิเตอร์",
      type: "weekday", // simple whole-team workday/holiday
      workers: [
        { id: uid(), name: "นายธนภัทร์ วิสิทธิ์", dailyRate: 366, contractorRate: 488 },
      ],
      schedule: {},
      docSettings: {
        companyName: "บริษัท สยามราชธานี จำกัด",
        contractNo: "จ.น.2-46/2567",
        teamName: "นายนิติพัฒน์ พุกสุข",
        siteName: "กฟส.บ้านทุ่งอ้ายโห้",
      },
    },
  ];
}

// ---------- main app ----------
function App() {
  const [teams, setTeams] = useState(defaultTeams()); // starts with defaults; replaced once Firestore loads
  const [loaded, setLoaded] = useState(false);
  const [activeTeamId, setActiveTeamId] = useState("outage");
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [tab, setTab] = useState("schedule");
  const [selectedDay, setSelectedDay] = useState(null);
  const [syncStatus, setSyncStatus] = useState("loading"); // loading | synced | saving | error
  const [syncError, setSyncError] = useState("");
  const skipNextSave = useRef(true); // avoid re-saving the data we just loaded

  // ---- load all teams from Firestore on first mount, seeding defaults if missing ----
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const defaults = defaultTeams();
        const loadedTeams = await Promise.all(
          defaults.map(async (def) => {
            const ref = db.collection(TEAMS_COLLECTION).doc(def.id);
            const snap = await ref.get();
            if (snap.exists) {
              const data = snap.data();
              return { ...def, ...data, docSettings: { ...def.docSettings, ...(data.docSettings || {}) } };
            }
            await ref.set(def);
            return def;
          })
        );
        if (!cancelled) {
          skipNextSave.current = true;
          setTeams(loadedTeams);
          setLoaded(true);
          setSyncStatus("synced");
        }
      } catch (e) {
        if (!cancelled) {
          setSyncStatus("error");
          setSyncError(e.message || String(e));
          setLoaded(true); // let the app keep working locally even if Firestore failed
        }
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // ---- debounced save back to Firestore whenever team data changes ----
  useEffect(() => {
    if (!loaded) return;
    if (skipNextSave.current) { skipNextSave.current = false; return; }
    setSyncStatus("saving");
    const timer = setTimeout(async () => {
      try {
        await Promise.all(teams.map((t) => db.collection(TEAMS_COLLECTION).doc(t.id).set(t)));
        setSyncStatus("synced");
      } catch (e) {
        setSyncStatus("error");
        setSyncError(e.message || String(e));
      }
    }, 900);
    return () => clearTimeout(timer);
  }, [teams, loaded]);

  const team = teams.find((t) => t.id === activeTeamId);
  const workers = team.workers;
  const schedule = team.schedule;
  const docSettings = team.docSettings;
  const dim = daysInMonth(year, month);

  const updateTeam = (patch) => {
    setTeams((prev) => prev.map((t) => (t.id === activeTeamId ? { ...t, ...(typeof patch === "function" ? patch(t) : patch) } : t)));
  };
  const setDocSettings = (fn) => updateTeam((t) => ({ docSettings: fn(t.docSettings) }));
  const setWorkers = (fn) => updateTeam((t) => ({ workers: fn(t.workers) }));
  const setSchedule = (fn) => updateTeam((t) => ({ schedule: fn(t.schedule) }));

  const workerColor = (id) => {
    const idx = workers.findIndex((w) => w.id === id);
    return idx >= 0 ? WORKER_COLORS[idx % WORKER_COLORS.length] : "#555";
  };
  const workerName = (id) => workers.find((w) => w.id === id)?.name ?? "";
  const firstNameOf = (fullName) => {
    const noTitle = fullName.replace(/^(นางสาว|นาง|นาย|น\.ส\.)/, "").trim();
    return noTitle.split(" ")[0] || fullName;
  };

  // ===================== ROTATION TEAM HELPERS =====================
  const emptyRotationEntry = () => ({ shifts: [null, null, null], holiday: "none" });
  const getEntry = (key) => schedule[key] || emptyRotationEntry();
  const updateEntry = (key, patch) => setSchedule((prev) => ({ ...prev, [key]: { ...emptyRotationEntry(), ...prev[key], ...patch } }));

  const rotationShiftsForDate = (date) => {
    const n = workers.length;
    if (n === 0) return [null, null, null];
    const r = ((daysBetween(ROTATION_EPOCH, date) % n) + n) % n;
    return [workers[r].id, workers[(r + 2) % n].id, workers[(r + 1) % n].id];
  };

  const setShift = (key, shiftIdx, workerId) => {
    const entry = getEntry(key);
    const shifts = [...entry.shifts];
    shifts[shiftIdx] = workerId || null;
    updateEntry(key, { shifts });
  };

  const setRotationHoliday = (key, holiday) => {
    const entry = getEntry(key);
    if (holiday === "worked") {
      const [y, m, d] = key.split("-").map(Number);
      const [s1, s2, s3] = rotationShiftsForDate(new Date(y, m - 1, d));
      const shifts = [...entry.shifts];
      if (!shifts[0]) shifts[0] = s1;
      if (!shifts[1]) shifts[1] = s2;
      if (!shifts[2]) shifts[2] = s3;
      updateEntry(key, { holiday, shifts });
    } else if (holiday === "off") {
      updateEntry(key, { holiday, shifts: [null, null, null] });
    } else {
      updateEntry(key, { holiday });
    }
  };

  const autoFillMonth = () => {
    if (workers.length === 0) return;
    setSchedule((prev) => {
      const next = { ...prev };
      for (let d = 1; d <= dim; d++) {
        const key = dateKey(year, month, d);
        const thisDate = new Date(year, month - 1, d);
        const weekday = thisDate.getDay();
        const isWeekend = weekday === 0 || weekday === 6;
        const existing = next[key] || emptyRotationEntry();
        const fillShift2 = isWeekend || existing.holiday === "worked";
        const [s1, s2, s3] = rotationShiftsForDate(thisDate);
        next[key] = { ...existing, shifts: [s1, fillShift2 ? s2 : null, s3] };
      }
      return next;
    });
  };

  function dayMultiplierRotation(entry) {
    if (entry.holiday === "off") return { mode: "off", mult: 1 };
    const mult = entry.holiday === "worked" ? 2 : 1;
    return { mode: "normal", mult };
  }

  // ===================== WEEKDAY TEAM HELPERS =====================
  const getWeekdayEntry = (key) => schedule[key] || {};
  const defaultWorked = (y, m, d) => {
    const wd = weekdayOf(y, m, d);
    return wd >= 1 && wd <= 5;
  };
  const effectiveWorked = (y, m, d) => {
    const entry = getWeekdayEntry(dateKey(y, m, d));
    return entry.worked === undefined ? defaultWorked(y, m, d) : entry.worked;
  };
  const toggleWorked = (y, m, d) => {
    const key = dateKey(y, m, d);
    const current = effectiveWorked(y, m, d);
    setSchedule((prev) => ({ ...prev, [key]: { ...prev[key], worked: !current } }));
  };
  const toggleHolidayFlag = (y, m, d) => {
    const key = dateKey(y, m, d);
    const entry = getWeekdayEntry(key);
    setSchedule((prev) => ({ ...prev, [key]: { ...prev[key], holiday: !entry.holiday } }));
  };
  const resetMonthWeekday = () => {
    setSchedule((prev) => {
      const next = { ...prev };
      for (let d = 1; d <= dim; d++) delete next[dateKey(year, month, d)];
      return next;
    });
  };

  // ===================== GENERIC (shared) UNITS-PER-DAY =====================
  // Returns { workerId: units(0/1/2) } for one day, regardless of team type.
  function unitsForDay(y, m, d) {
    const units = {};
    if (team.type === "rotation") {
      const entry = getEntry(dateKey(y, m, d));
      const { mode, mult } = dayMultiplierRotation(entry);
      if (mode === "off") {
        workers.forEach((w) => (units[w.id] = 1));
        return units;
      }
      const workedToday = new Set(entry.shifts.filter(Boolean));
      workers.forEach((w) => (units[w.id] = workedToday.has(w.id) ? mult : 0));
      return units;
    }
    // weekday team: whole team shares the same value
    const entry = getWeekdayEntry(dateKey(y, m, d));
    const worked = effectiveWorked(y, m, d);
    const holiday = !!entry.holiday;
    const value = holiday ? (worked ? 2 : 1) : worked ? 1 : 0;
    workers.forEach((w) => (units[w.id] = value));
    return units;
  }

  function computePeriod(fromDay, toDay) {
    const totals = {};
    workers.forEach((w) => (totals[w.id] = 0));
    for (let d = fromDay; d <= toDay; d++) {
      const u = unitsForDay(year, month, d);
      workers.forEach((w) => (totals[w.id] += u[w.id] || 0));
    }
    return totals;
  }

  const period1 = useMemo(() => computePeriod(1, Math.min(15, dim)), [teams, activeTeamId, year, month]);
  const period2 = useMemo(() => computePeriod(16, dim), [teams, activeTeamId, year, month]);

  const yearlyTotals = useMemo(() => {
    const totals = {};
    workers.forEach((w) => (totals[w.id] = { net: 0, contractor: 0 }));
    for (let m = 1; m <= 12; m++) {
      const dm = daysInMonth(year, m);
      [
        [1, Math.min(15, dm)],
        [16, dm],
      ].forEach(([from, to]) => {
        const perWorker = {};
        workers.forEach((w) => (perWorker[w.id] = 0));
        for (let d = from; d <= to; d++) {
          const key = dateKey(year, m, d);
          let u;
          if (team.type === "rotation") {
            const entry = schedule[key] || emptyRotationEntry();
            const { mode, mult } = dayMultiplierRotation(entry);
            u = {};
            if (mode === "off") workers.forEach((w) => (u[w.id] = 1));
            else {
              const workedToday = new Set(entry.shifts.filter(Boolean));
              workers.forEach((w) => (u[w.id] = workedToday.has(w.id) ? mult : 0));
            }
          } else {
            const entry = schedule[key] || {};
            const wd = weekdayOf(year, m, d);
            const worked = entry.worked === undefined ? wd >= 1 && wd <= 5 : entry.worked;
            const holiday = !!entry.holiday;
            const value = holiday ? (worked ? 2 : 1) : worked ? 1 : 0;
            u = {};
            workers.forEach((w) => (u[w.id] = value));
          }
          workers.forEach((w) => (perWorker[w.id] += u[w.id] || 0));
        }
        workers.forEach((w) => {
          const units = perWorker[w.id];
          const gross = units * w.dailyRate;
          const net = gross - gross * SSO_RATE;
          totals[w.id].net += net;
          totals[w.id].contractor += units * w.contractorRate;
        });
      });
    }
    return totals;
  }, [teams, activeTeamId, year]);

  const leadingBlanks = weekdayOf(year, month, 1);
  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) cells.push(null);
  for (let d = 1; d <= dim; d++) cells.push(d);

  const money = (n) => n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ===================== EXPORT: PAYROLL EXCEL (generic across team types) =====================
  function periodRows(fromDay, toDay) {
    const days = [];
    for (let d = fromDay; d <= toDay; d++) days.push(d);
    const header = ["ลำดับ", "ชื่อ - สกุล", ...days.map((d) => String(d)), "รวม", "ค่าจ้างวันละ", "รวมเป็นเงิน", "หักประกันสังคม (5%)", "จ่ายสุทธิ", "อัตราผู้รับจ้าง (วันละ)", "รวมจ่ายให้ผู้รับจ้าง"];
    const rows = [header];
    let sumUnits = 0, sumGross = 0, sumSso = 0, sumNet = 0, sumContractor = 0;
    workers.forEach((w, i) => {
      let units = 0;
      const dayVals = days.map((d) => {
        const u = unitsForDay(year, month, d)[w.id] || 0;
        units += u;
        return u;
      });
      const gross = units * w.dailyRate;
      const sso = gross * SSO_RATE;
      const net = gross - sso;
      const contractor = units * w.contractorRate;
      sumUnits += units; sumGross += gross; sumSso += sso; sumNet += net; sumContractor += contractor;
      rows.push([i + 1, w.name, ...dayVals, units, w.dailyRate, gross, Number(sso.toFixed(2)), Number(net.toFixed(2)), w.contractorRate, contractor]);
    });
    rows.push(["", "รวม", ...days.map(() => ""), sumUnits, "", sumGross, Number(sumSso.toFixed(2)), Number(sumNet.toFixed(2)), "", sumContractor]);
    rows.push([]);
    rows.push(["", "รวมเงินจ่ายให้ผู้รับจ้าง", "", "", "", "", "", "", "", "", sumContractor]);
    return rows;
  }

  function exportExcelMonth() {
    const wb = XLSX.utils.book_new();
    const p1 = periodRows(1, Math.min(15, dim));
    const p2 = periodRows(16, dim);
    const titleBlock = [
      [docSettings.companyName],
      ["สรุปค่าแรงและค่าจ้าง", "", "", "", "", `ตามสัญญาจ้างเลขที่ ${docSettings.contractNo}`],
      [`สถานที่ปฏิบัติงาน: ${docSettings.siteName}`],
      [`ทีม ${docSettings.teamName}`],
      [],
    ];
    const aoa = [
      ...titleBlock,
      [`ประจำงวดที่ 1 - ${Math.min(15, dim)} ${THAI_MONTHS_FULL[month - 1]} ${year + 543}`],
      ...p1,
      [],
      [`ประจำงวดที่ 16 - ${dim} ${THAI_MONTHS_FULL[month - 1]} ${year + 543}`],
      ...p2,
      [],
      ["ลงชื่อ.......................................... ตัวแทนผู้รับจ้าง", "", "", "", "", "ลงชื่อ.......................................... พบช. ผู้คุมงบคู่สัญญา"],
    ];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 6 }, { wch: 26 }];
    XLSX.utils.book_append_sheet(wb, ws, `${THAI_MONTHS[month - 1]}${year + 543}`.slice(0, 31));
    XLSX.writeFile(wb, `ค่าแรง_${team.name}_${THAI_MONTHS[month - 1]}${year + 543}.xlsx`);
  }

  // ===================== EXPORT: SCHEDULE EXCEL (differs per team type) =====================
  function exportScheduleExcel() {
    const wb = XLSX.utils.book_new();
    const rows = [];

    if (team.type === "rotation") {
      const shift1Count = {}, shift2Count = {}, shift3Count = {};
      workers.forEach((w) => { shift1Count[w.id] = 0; shift2Count[w.id] = 0; shift3Count[w.id] = 0; });
      for (let d = 1; d <= dim; d++) {
        const entry = getEntry(dateKey(year, month, d));
        if (entry.shifts[0] && shift1Count[entry.shifts[0]] !== undefined) shift1Count[entry.shifts[0]]++;
        if (entry.shifts[1] && shift2Count[entry.shifts[1]] !== undefined) shift2Count[entry.shifts[1]]++;
        if (entry.shifts[2] && shift3Count[entry.shifts[2]] !== undefined) shift3Count[entry.shifts[2]]++;
      }
      rows.push([`ตารางการปฏิบัติงานประจำวัน ของ คนงาน ${docSettings.siteName}`, "", "", "", "", "", ...workers.map((w) => w.name)]);
      rows.push([`ประจำเดือน ${THAI_MONTHS_FULL[month - 1]}  พ.ศ.  ${year + 543}`, "", "", "", "", "เวลา 00:30 น. - 08:30 น.", ...workers.map((w) => shift1Count[w.id])]);
      rows.push(["วัน", "ที่", "เวลา 00:00 น. - 08:00 น.", "เวลา 08:00 น. - 16:00 น.", "เวลา 16:00 น. - 24:00 น.", "เวลา 08:30 น. - 16:30 น.", ...workers.map((w) => shift2Count[w.id])]);
      for (let d = 1; d <= dim; d++) {
        const entry = getEntry(dateKey(year, month, d));
        const weekday = new Date(year, month - 1, d).getDay();
        const row = [THAI_DAYS_FULL[weekday], d, workerName(entry.shifts[0]) || "", workerName(entry.shifts[1]) || "", workerName(entry.shifts[2]) || ""];
        if (d === 1) row.push("เวลา 16:30 น. - 00:30 น.", ...workers.map((w) => shift3Count[w.id]));
        else if (d === 2) row.push("รวม", ...workers.map((w) => shift1Count[w.id] + shift2Count[w.id] + shift3Count[w.id]));
        rows.push(row);
      }
    } else {
      rows.push([`ตารางการปฏิบัติงานประจำวัน ของ คนงาน ${docSettings.siteName}`]);
      rows.push([`ประจำเดือน ${THAI_MONTHS_FULL[month - 1]}  พ.ศ.  ${year + 543}`]);

        <>
          <div className="card">
            <div className="row" style={{ justifyContent: "space-between" }}>
              <div className="month-nav">
                <button className="btn small" onClick={() => setMonth((m) => (m === 1 ? (setYear((y) => y - 1), 12) : m - 1))}>‹</button>
                <div className="month-label mono">{THAI_MONTHS_FULL[month - 1]} {year + 543}</div>
                <button className="btn small" onClick={() => setMonth((m) => (m === 12 ? (setYear((y) => y + 1), 1) : m + 1))}>›</button>
              </div>
              <div className="row">
                <button className="btn primary" onClick={exportExcelMonth}>ดาวน์โหลด Excel (.xlsx)</button>
                <button className="btn" onClick={() => window.print()}>พิมพ์ / บันทึกเป็น PDF</button>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="section-title">ข้อมูลหัวเอกสาร — {team.name} (ใช้ตอนส่งออก Excel / PDF)</div>
            <div className="editor-grid">
              <div className="editor-shift-row"><div className="editor-shift-time" style={{ width: 160 }}>ชื่อบริษัท</div><input type="text" value={docSettings.companyName} onChange={(e) => setDocSettings((s) => ({ ...s, companyName: e.target.value }))} /></div>
              <div className="editor-shift-row"><div className="editor-shift-time" style={{ width: 160 }}>เลขที่สัญญาจ้าง</div><input type="text" value={docSettings.contractNo} onChange={(e) => setDocSettings((s) => ({ ...s, contractNo: e.target.value }))} /></div>
              <div className="editor-shift-row"><div className="editor-shift-time" style={{ width: 160 }}>ชื่อทีม / หัวหน้าทีม</div><input type="text" value={docSettings.teamName} onChange={(e) => setDocSettings((s) => ({ ...s, teamName: e.target.value }))} /></div>
              <div className="editor-shift-row"><div className="editor-shift-time" style={{ width: 160 }}>สถานที่ปฏิบัติงาน</div><input type="text" value={docSettings.siteName} onChange={(e) => setDocSettings((s) => ({ ...s, siteName: e.target.value }))} /></div>
            </div>
          </div>

          {[
            { title: `งวดที่ 1 (1 - ${Math.min(15, dim)})`, data: period1 },
            { title: `งวดที่ 2 (16 - ${dim})`, data: period2 },
          ].map(({ title, data }) => {
            let sumNet = 0, sumContractor = 0;
            return (
              <div className="card" key={title}>
                <div className="section-title">{title}</div>
                <div className="table-scroll">
                <table>
                  <thead>
                    <tr><th>ชื่อ</th><th>รวมแรง</th><th>ค่าจ้างวันละ</th><th>รวมเป็นเงิน</th><th>หักประกันสังคม 5%</th><th>จ่ายสุทธิ</th><th>อัตราผู้รับจ้าง</th><th>รวมจ่ายผู้รับจ้าง</th></tr>
                  </thead>
                  <tbody>
                    {workers.map((w) => {
                      const units = data[w.id] || 0;
                      const gross = units * w.dailyRate;
                      const sso = gross * SSO_RATE;
                      const net = gross - sso;
                      const contractor = units * w.contractorRate;
                      sumNet += net; sumContractor += contractor;
                      return (
                        <tr key={w.id}>
                          <td>{w.name}</td><td className="mono">{units}</td><td className="mono">{money(w.dailyRate)}</td><td className="mono">{money(gross)}</td>
                          <td className="mono">{money(sso)}</td><td className="mono">{money(net)}</td><td className="mono">{money(w.contractorRate)}</td><td className="mono">{money(contractor)}</td>
                        </tr>
                      );
                    })}
                    <tr className="total-row"><td colSpan={5}>รวม</td><td className="mono">{money(sumNet)}</td><td></td><td className="mono">{money(sumContractor)}</td></tr>
                  </tbody>
                </table>
                </div>
              </div>
            );
          })}
        </>
      )}

      {tab === "yearly" && (
        <div className="card">
          <div className="section-title">สรุปค่าแรงรวมทั้งปี {year + 543} — {team.name}</div>
          <div className="row" style={{ marginBottom: 10 }}>
            <button className="btn small" onClick={() => setYear((y) => y - 1)}>‹ ปีก่อนหน้า</button>
            <div className="mono" style={{ fontWeight: 600 }}>{year + 543}</div>
            <button className="btn small" onClick={() => setYear((y) => y + 1)}>ปีถัดไป ›</button>
          </div>
          <div className="table-scroll">
          <table>
            <thead><tr><th>ชื่อ</th><th>จ่ายสุทธิรวมทั้งปี</th><th>รวมจ่ายผู้รับจ้างทั้งปี</th></tr></thead>
            <tbody>
              {workers.map((w) => (
                <tr key={w.id}><td>{w.name}</td><td className="mono">{money(yearlyTotals[w.id]?.net || 0)}</td><td className="mono">{money(yearlyTotals[w.id]?.contractor || 0)}</td></tr>
              ))}
            </tbody>
          </table>
          </div>
          <div className="section-sub" style={{ marginTop: 12 }}>หมายเหตุ: ยอดคำนวณจากตารางเวรที่กรอกไว้ในแต่ละเดือนของปีนี้เท่านั้น เดือนที่ยังไม่ได้กรอกจะถือค่าเริ่มต้นของทีมนั้น (ทีมแก้ไฟฯ = ไม่มีเวร, ทีมซ่อมบำรุงฯ = ทำงานจันทร์-ศุกร์ตามปกติ)</div>
        </div>
      )}

      <div id="printable-area" className="print-only">
        {(() => {
          const blocks = [
            { label: `1 - ${Math.min(15, dim)}`, from: 1, to: Math.min(15, dim) },
            { label: `16 - ${dim}`, from: 16, to: dim },
          ];
          return (
            <>
              <div className="doc-head">{docSettings.companyName}</div>
              <h2>สรุปค่าแรงและค่าจ้าง — ตามสัญญาจ้างเลขที่ {docSettings.contractNo}</h2>
              <div className="doc-head">ทีม: {team.name} ({docSettings.teamName}) &nbsp;|&nbsp; สถานที่ปฏิบัติงาน: {docSettings.siteName}</div>
              {blocks.map((b) => {
                const days = [];
                for (let d = b.from; d <= b.to; d++) days.push(d);
                let sumUnits = 0, sumGross = 0, sumSso = 0, sumNet = 0, sumContractor = 0;
                return (
                  <div className="period-block" key={b.label}>
                    <h2>ประจำงวดที่ {b.label} {THAI_MONTHS_FULL[month - 1]} {year + 543}</h2>
                    <table>
                      <thead>
                        <tr>
                          <th>ลำดับ</th><th>ชื่อ - สกุล</th>
                          {days.map((d) => <th key={d}>{d}</th>)}
                          <th>รวม</th><th>ค่าจ้างวันละ</th><th>รวมเป็นเงิน</th><th>ประกันสังคม 5%</th><th>จ่ายสุทธิ</th><th>อัตรา ผรจ.</th><th>รวมจ่าย ผรจ.</th>
                        </tr>
                      </thead>
                      <tbody>
                        {workers.map((w, i) => {
                          let units = 0;
                          const dayVals = days.map((d) => {
                            const u = unitsForDay(year, month, d)[w.id] || 0;
                            units += u;
                            return u;
                          });
                          const gross = units * w.dailyRate;
                          const sso = gross * SSO_RATE;
                          const net = gross - sso;
                          const contractor = units * w.contractorRate;
                          sumUnits += units; sumGross += gross; sumSso += sso; sumNet += net; sumContractor += contractor;
                          return (
                            <tr key={w.id}>
                              <td>{i + 1}</td><td>{w.name}</td>
                              {dayVals.map((v, vi) => <td key={vi}>{v || "-"}</td>)}
                              <td>{units}</td><td>{w.dailyRate}</td><td>{money(gross)}</td><td>{money(sso)}</td><td>{money(net)}</td><td>{w.contractorRate}</td><td>{money(contractor)}</td>
                            </tr>
                          );
                        })}
                        <tr>
                          <td colSpan={2 + days.length}>รวม</td>
                          <td>{sumUnits}</td><td></td><td>{money(sumGross)}</td><td>{money(sumSso)}</td><td>{money(sumNet)}</td><td></td><td>{money(sumContractor)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                );
              })}
              <div className="sign-row">
                <div>ลงชื่อ.......................................... ตัวแทนผู้รับจ้าง</div>
                <div>ลงชื่อ.......................................... พบช. ผู้คุมงบคู่สัญญา</div>
              </div>
            </>
          );
        })()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
