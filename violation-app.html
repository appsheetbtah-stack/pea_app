<!DOCTYPE html>
<html lang="th">
<head>
<script>
(function(){
  var saved = localStorage.getItem('pea-theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ละเมิด ลักใช้ไฟ - PEA</title>
<meta name="theme-color" content="#0f1923">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1923; --surface:#162030; --surface2:#1e2d3d; --border:#2a3f55;
  --accent:#f5a623; --accent2:#e05c2a; --blue:#3b9ede; --green:#2ecc71; --red:#e74c3c;
  --yellow:#f39c12; --text:#e8f0f8; --text2:#a9bdd1;
  --mono:'IBM Plex Mono',monospace; --sans:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif;
  --topbar:52px; --botnav:56px;
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg:#e7ebf1;
  --surface:#ffffff;
  --surface2:#e3e8f0;
  --border:#d2dae4;
  --accent:#d97f0a;
  --text:#131f2b;
  --text2:#5b6b7d;
  color-scheme: light;
}

* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.5; }

/* ── TOPBAR ── */
.topbar {
  position:fixed; top:0; left:0; right:0; height:var(--topbar); z-index:600;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 12px;
}
.back-btn {
  color:var(--text2); text-decoration:none; font-size:13px;
  display:flex; align-items:center; gap:4px;
  padding:6px 10px; border:1px solid var(--border); border-radius:6px;
  flex-shrink:0; transition:color .15s;
}
.back-btn:hover { color:var(--accent); border-color:var(--accent); }
.topbar-title {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;
  white-space:nowrap; pointer-events:none;
}
.meter-icon { flex-shrink:0; }
.topbar-btn {
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  width:34px; height:34px; border-radius:8px; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.topbar-btn:active { border-color:var(--accent); color:var(--accent); }

/* ── TAB CONTENT ── */
.tab-pane { position:fixed; top:var(--topbar); left:0; right:0; bottom:var(--botnav); overflow-y:auto; display:none; }
.tab-pane.active { display:block; }
.tab-pane.map-pane { display:none; overflow:hidden; flex-direction:column; }
.tab-pane.map-pane.active { display:flex; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; height:var(--botnav); z-index:600;
  background:var(--surface); border-top:1px solid var(--border); display:flex;
  box-shadow:0 -6px 18px rgba(0,0,0,.35);
}
.nav-btn {
  flex:1; background:none; border:none; color:var(--text2); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; cursor:pointer; padding:6px 4px;
  transition:color .2s;
}
.nav-btn.active { color:var(--accent); }
.nav-btn:active .nav-icon { transform:scale(.88); }
.nav-icon {
  font-size:19px; width:38px; height:38px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; border:1.5px solid transparent; transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.nav-btn.active .nav-icon {
  transform:translateY(-3px) scale(1.06);
}
.nav-label { font-size:11px; font-weight:600; }
.nav-btn.active .nav-label { font-weight:700; }

/* ── LIST PANE ── */
.list-wrap { padding:12px; display:flex; flex-direction:column; gap:12px; }
.search-box {
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:10px 14px; display:flex; align-items:center; gap:8px;
}
.search-box input { flex:1; background:none; border:none; color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; outline:none; }
.filter-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
.filter-row::-webkit-scrollbar { display:none; }
.outstanding-banner {
  display:none; align-items:center; gap:8px; padding:10px 12px; border-radius:10px;
  font-size:13.5px; font-weight:600; margin-bottom:10px;
}
.outstanding-banner.show { display:flex; }
.outstanding-banner.pending { background:#e74c3c; color:#fff; border:1px solid #c0392b; }
.outstanding-banner.done    { background:#2ecc71; color:#0b2b18; border:1px solid #27ae60; }
.filter-chip {
  flex-shrink:0; border:1px solid var(--border); background:var(--surface2); color:var(--text2);
  font-family:var(--sans); font-size:13px; font-weight:600; padding:7px 14px;
  border-radius:20px; cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
}
.filter-chip.active { border-color:var(--accent); background:rgba(245,166,35,.15); color:var(--accent); }

.ticket-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; cursor:pointer; }
.ticket-card:active { border-color:var(--accent); }
.ticket-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.ticket-thumb-lg { width:76px; height:76px; border-radius:12px; object-fit:cover; border:2px solid var(--accent); flex-shrink:0; box-shadow:0 3px 10px rgba(0,0,0,.35); }
.ticket-name { font-weight:700; font-size:15px; }
.ticket-sub { font-size:13px; color:var(--text2); }
.status-badge { font-size:12px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0; }
.status-pending  { background:rgba(169,189,209,.15); color:var(--text2); }
.status-broken   { background:rgba(231,76,60,.15); color:var(--red); }
.status-field    { background:rgba(243,156,18,.15); color:var(--yellow); }
.status-sap      { background:rgba(46,204,113,.15); color:var(--green); }
.tc-photo-placeholder {
  width:76px; height:76px; border-radius:12px; flex-shrink:0; background:var(--surface2);
  border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:26px;
}
.tc-meter-chip {
  background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 10px;
  font-family:var(--mono); font-size:12.5px; color:var(--text); margin-top:4px;
}
.tc-reason { font-size:13px; color:var(--text2); margin-top:4px; }
.tc-oldmeter-chip {
  background:rgba(243,156,18,.12); border:1px solid rgba(243,156,18,.35); border-radius:8px; padding:7px 10px;
  font-family:var(--mono); font-size:12.5px; color:var(--yellow); margin-top:4px;
}
.ticket-detail-row { font-size:13px; color:var(--text2); display:flex; gap:6px; }
.ticket-reqno { font-family:var(--mono); font-size:12px; color:var(--text2); }
.ticket-latlng { font-family:var(--mono); font-size:12px; color:var(--text2); }
.ticket-actions { display:flex; gap:8px; margin-top:2px; }
.ticket-action-btn {
  flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface2); color:var(--text); font-family:var(--sans);
  font-size:12.5px; font-weight:600; cursor:pointer;
}
.ticket-action-btn:active { border-color:var(--accent); }
.ticket-action-btn.nav { background:rgba(59,158,222,.15); color:var(--blue); border-color:rgba(59,158,222,.3); }
.ticket-action-btn.danger { background:rgba(224,60,60,.15); color:#e04c4c; border-color:rgba(224,60,60,.3); }
.ticket-action-btn:disabled { opacity:.4; cursor:not-allowed; }

/* ── DASHBOARD ── */
.dash-period-tabs { display:flex; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px; }
.dash-period-btn {
  flex:1; background:none; border:none; color:var(--text2); font-family:var(--sans);
  font-size:14px; font-weight:700; padding:9px 0; border-radius:8px; cursor:pointer;
}
.dash-period-btn.active { background:var(--accent); color:#000; }
.dash-period-title { font-size:14px; font-weight:700; color:var(--text2); margin:2px 2px 4px; }
.dash-month-select-row { display:flex; align-items:center; gap:10px; }
.dash-month-select-row .reason-picker-field { flex:1; }
.select-hidden { display:none !important; }
#dash-view-month, #dash-view-year { display:flex; flex-direction:column; gap:12px; }
.dash-pie-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; }
.dash-pie-box { position:relative; width:132px; height:132px; flex-shrink:0; }
.dash-pie { width:132px; height:132px; border-radius:50%; background:var(--surface2); }
.dash-pie-hole {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:78px; height:78px; border-radius:50%; background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.dash-pie-hole span { font-family:var(--mono); font-size:20px; font-weight:800; line-height:1.1; }
.dash-pie-hole small { font-size:10px; color:var(--text2); margin-top:2px; }
.dash-pie-legend { display:flex; flex-direction:column; align-items:center; gap:10px; }
.dash-pie-legend-row { display:flex; align-items:center; justify-content:center; gap:8px; font-size:12.5px; text-align:center; }
.dash-pie-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.dash-pie-name { color:var(--text2); }
.dash-pie-val { font-family:var(--mono); font-weight:700; white-space:nowrap; }
.dash-pie-pct { color:var(--text2); font-weight:400; }

.dash-insight { font-size:12.5px; color:var(--text2); line-height:1.6; margin-top:6px; padding-top:8px; border-top:1px solid var(--border); }
.dash-insight b { color:var(--text); font-family:var(--mono); }

.dash-trend-legend { display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:8px; }
.trend-legend-item { display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text2); }
.trend-legend-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }

.dash-month-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border); }
.dash-month-row:first-child { border-top:none; }
.dash-month-name { font-size:12.5px; color:var(--text2); flex-shrink:0; width:74px; }
.dash-month-track { flex:1; height:7px; background:var(--surface2); border-radius:5px; overflow:hidden; }
.dash-month-fill { height:100%; background:var(--accent); border-radius:5px; }
.dash-month-count { font-family:var(--mono); font-size:12.5px; font-weight:700; width:24px; text-align:right; flex-shrink:0; }

.dash-stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.dash-stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; border-top:3px solid var(--border); }
.dash-stat-card.orange { border-top-color:var(--accent); }
.dash-stat-card.blue   { border-top-color:var(--blue); }
.dash-stat-card.red    { border-top-color:var(--red); }
.dash-stat-card.green  { border-top-color:var(--green); }
.dash-stat-label { font-size:13.5px; color:var(--text2); margin-bottom:6px; }
.dash-stat-num { font-size:28px; font-weight:800; font-family:var(--mono); line-height:1.1; }
.dash-stat-unit { font-size:12.5px; color:var(--text2); margin-top:4px; }
.dash-section { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:14px; }
.dash-section-title { font-weight:700; font-size:15px; }
.dash-bar-row { display:flex; align-items:center; gap:8px; }
.dash-bar-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.dash-bar-label { font-size:12px; color:var(--text2); flex-shrink:0; width:128px; line-height:1.3; }
.dash-bar-track { flex:1; height:8px; background:var(--surface2); border-radius:6px; overflow:hidden; }
.dash-bar-fill { height:100%; border-radius:6px; transition:width .3s; }
.dash-bar-count { font-family:var(--mono); font-size:13px; font-weight:700; width:26px; text-align:right; flex-shrink:0; }

.empty-state { padding:60px 20px; text-align:center; color:var(--text2); }
.empty-icon { font-size:40px; margin-bottom:10px; }

/* ── MAP PANE ── */
.map-pane-inner { position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.9); }
#map { flex:1; min-height:0; }
.map-batch-bar {
  position:absolute; top:10px; left:10px; right:10px; z-index:501;
  display:flex; flex-direction:column; gap:8px;
}
.map-batch-bar .reason-picker-field { background:var(--surface); color:var(--text); border:1px solid var(--border); box-shadow:0 1px 6px rgba(0,0,0,.15); margin:0; }
.map-batch-bar .map-search-box { box-shadow:0 1px 6px rgba(0,0,0,.15); }
.map-batch-bar .outstanding-banner { margin-bottom:0; }
.map-legend {
  background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:10px;
  padding:8px 12px; font-size:12px; display:flex; gap:12px; flex-wrap:wrap;
  box-shadow:0 1px 6px rgba(0,0,0,.15);
}
.map-legend span { display:flex; align-items:center; gap:5px; }
.legend-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.legend-pin {
  width:20px; height:20px; border-radius:50%; display:inline-flex;
  align-items:center; justify-content:center; font-size:11px; flex-shrink:0;
  border:1.5px solid #0f1923;
}

.ticket-pin { background:transparent; border:none; }
.pin-body {
  width:28px; height:28px; border-radius:50% 50% 50% 0; transform:rotate(45deg);
  display:flex; align-items:center; justify-content:center;
  border:2px solid #0f1923; box-shadow:0 1px 4px rgba(0,0,0,.4);
  position:absolute; top:0; left:1px;
}
.pin-body span, .pin-body img { transform:rotate(-45deg); font-size:14px; line-height:1; }
.status-icon-img { width:16px; height:16px; object-fit:contain; display:inline-block; vertical-align:middle; }
.legend-pin .status-icon-img { width:13px; height:13px; }
.fdd-status-icon { margin-right:6px; }
.filter-menu-item .status-icon-img { flex:none; }
.popup-detail { display:inline-block; margin-top:4px; color:#333; font-size:12.5px; }
.popup-actions { display:flex; gap:6px; margin-top:8px; }
.popup-btn {
  flex:1; padding:6px 8px; border-radius:6px; border:none; cursor:pointer;
  font-family:'Sarabun',sans-serif; font-size:12.5px; font-weight:700; white-space:nowrap;
}
.popup-btn.detail { background:#f5a623; color:#000; }
.popup-btn.nav { background:#3b9ede; color:#fff; }

/* ── MODAL ── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:900; display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.active { display:flex; }
.modal { background:var(--bg); width:100%; max-width:600px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; border:1px solid var(--border); border-bottom:none; }
.modal-header { position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; z-index:2; }
.modal-title { font-weight:700; font-size:15px; }
.modal-close { background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; }
.modal-body { padding:16px; display:flex; flex-direction:column; gap:16px; }
.modal-footer { position:sticky; bottom:0; background:var(--surface); border-top:1px solid var(--border); padding:12px 16px; display:flex; gap:10px; }

.info-block { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
.info-row { display:flex; gap:10px; font-size:14px; align-items:center; }
.info-label { color:var(--text2); flex-shrink:0; width:96px; }
.info-value { font-weight:600; word-break:break-word; }
.info-edit-input { flex:1; min-width:0; background:transparent; border:none; border-bottom:1px dashed var(--text2); color:#fff; font-weight:600; font-size:14px; font-family:inherit; padding:3px 0; }
.info-edit-input:focus { outline:none; border-bottom:1px solid var(--accent, #f5a623); }
.info-edit-input::placeholder { color:var(--text2); font-weight:400; }

.field-label { font-size:13px; color:var(--text2); margin-bottom:6px; display:block; font-weight:600; }
.field-input, .field-select {
  width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; color:var(--text); font-family:var(--sans); font-size:14px; outline:none;
}
.field-input:focus, .field-select:focus { border-color:var(--accent); }
.field-hint { font-size:12px; color:var(--text2); margin-top:5px; }

.checklist { display:flex; flex-direction:column; gap:2px; max-height:240px; overflow-y:auto; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px; }
.checklist-item {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 10px; font-size:14px; border-radius:6px; cursor:pointer;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.checklist-item:active { background:var(--border); }
.checklist-item .check-icon {
  width:20px; height:20px; flex-shrink:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:700; color:#fff; background:var(--accent);
  opacity:0; transform:scale(.6); transition:opacity .12s, transform .12s;
}
.checklist-item.selected { background:rgba(245,166,35,0.16); color:var(--accent); font-weight:600; }
.checklist-item.selected .check-icon { opacity:1; transform:scale(1); }
.add-reason-row { display:flex; gap:8px; margin-top:8px; }
.reason-picker-field {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  cursor:pointer; color:var(--text2); min-height:20px;
}
.reason-picker-field.has-value { color:var(--text); }
.reason-picker-field::after { content:'▾'; color:var(--text2); flex-shrink:0; }
.add-reason-row input { flex:1; }

.radio-list { display:flex; flex-direction:column; }
.radio-item {
  display:flex; align-items:center; justify-content:flex-start; gap:10px;
  padding:14px 4px; font-size:15px; cursor:pointer; border-bottom:1px solid var(--border);
  user-select:none; -webkit-tap-highlight-color:transparent; text-align:left;
}
.radio-item:last-child { border-bottom:none; }
.radio-item:active { background:var(--surface2); }
.radio-item.selected { color:var(--accent); font-weight:600; }
.radio-text { flex:1; text-align:left; }
.radio-dot {
  width:20px; height:20px; flex-shrink:0; border-radius:50%; border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; transition:border-color .12s;
}
.radio-item.selected .radio-dot { border-color:var(--accent); }
.radio-dot::after {
  content:''; width:10px; height:10px; border-radius:50%; background:var(--accent);
  opacity:0; transform:scale(.5); transition:opacity .12s, transform .12s;
}
.radio-item.selected .radio-dot::after { opacity:1; transform:scale(1); }



.meter-input-row { display:flex; gap:8px; }
.meter-input-row .field-input { flex:1; }
.btn-scan { flex-shrink:0; width:44px; background:var(--blue); border:none; border-radius:8px; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

.photo-row { display:flex; align-items:center; gap:10px; }
.photo-preview { width:100%; max-height:340px; border-radius:10px; object-fit:contain; background:var(--surface2); border:1px solid var(--border); margin-bottom:10px; }
.btn { padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-family:var(--sans); font-size:14px; font-weight:600; white-space:nowrap; }
.btn-primary { background:var(--accent); color:#000; flex:1; }
.btn-ghost { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
.btn-blue { background:var(--blue); color:#fff; }
.btn-accent { background:var(--accent); color:#1a1206; }
.upload-status { font-size:13px; color:var(--text2); }
.upload-status.uploading { color:var(--blue); }
.upload-status.error { color:var(--red); }

  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function escAttr(s) { return esc(s); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function fullName(t) {
  return [t.prefix, t.customerName, t.customerSirname].filter(Boolean).join(' ') || '(ไม่ระบุชื่อ)';
}
function fullAddress(t) {

function searchCustomers(qstr) {
  const records = window.ALL_RECORDS;
  if (!records || !records.length) return [];
  const qq = qstr.trim().toLowerCase();
  if (qq.length < 2) return [];
  const out = [];
  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const hay = `${r.CUSTOMERNAME||''} ${r.CUSTOMERSIRNAME||''} ${r.CA||''} ${r.PEANO||''} ${r.MOBILE_NO||''}`.toLowerCase();
    if (hay.includes(qq)) { out.push(r); if (out.length >= 20) break; }
  }
  return out;
}

function captureGPS() {

    btn.disabled = false; btn.textContent = '📍 ใช้ตำแหน่งปัจจุบัน';
  }, { enableHighAccuracy: true, timeout: 15000 });

// ══════════════════════════ GOOGLE DRIVE (รูปถ่าย — บัญชีส่วนตัวของผู้ใช้แต่ละคน) ══════════════════════════
const GOOGLE_CLIENT_ID = '1006235611544-tv5slgr1vef55i8ol56embfdvrimns4i.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';
let driveTokenClient = null;
let driveAccessToken = null;
let driveAccountEmail = null;
let driveFolderCache = {};

(function loadSavedDriveAuth() {
  try {
    const saved = JSON.parse(localStorage.getItem('vlt_drive_token') || 'null');
    if (saved && saved.token && saved.expiresAt && Date.now() < saved.expiresAt) driveAccessToken = saved.token;
    driveAccountEmail = localStorage.getItem('vlt_drive_email') || null;
  } catch (e) {}
})();

function saveDriveToken(token, expiresInSec) {
  try {
    localStorage.setItem('vlt_drive_token', JSON.stringify({ token, expiresAt: Date.now() + ((expiresInSec || 3500) * 1000) - 60000 }));
    localStorage.setItem('vlt_drive_authorized', '1');
    if (driveAccountEmail) localStorage.setItem('vlt_drive_email', driveAccountEmail);
  } catch (e) {}
}
function isDriveTokenExpired() {
  try {
    const saved = JSON.parse(localStorage.getItem('vlt_drive_token') || 'null');
    if (!saved || !saved.expiresAt) return true;
    return Date.now() >= saved.expiresAt;
  } catch (e) { return true; }
}
function getDriveTokenClient() {
  if (driveTokenClient) return driveTokenClient;
  if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) return null;
  driveTokenClient = google.accounts.oauth2.initTokenClient({ client_id: GOOGLE_CLIENT_ID, scope: DRIVE_SCOPE, callback: '' });
  return driveTokenClient;
}
function requestDriveAccessToken(promptOverride) {
  const attempt = new Promise((resolve, reject) => {
    const client = getDriveTokenClient();
    if (!client) { reject(new Error('โหลดระบบล็อกอิน Google ไม่สำเร็จ ลองรีเฟรชหน้าใหม่')); return; }
    client.callback = (resp) => {
      if (resp.error) {
        try { localStorage.removeItem('vlt_drive_authorized'); } catch (e) {}
        reject(new Error(resp.error)); return;
      }
      driveAccessToken = resp.access_token;
      saveDriveToken(resp.access_token, resp.expires_in);
      resolve(driveAccessToken);
    };
    let everAuthorized = false;
    try { everAuthorized = !!localStorage.getItem('vlt_drive_authorized'); } catch (e) {}
    const prompt = promptOverride !== undefined ? promptOverride : ((driveAccessToken || everAuthorized) ? '' : 'consent');
    // ไม่ระบุ hint บัญชี — ให้ผู้ใช้แต่ละคนเลือกบัญชี Google ส่วนตัวของตัวเองได้อิสระ
    client.requestAccessToken({ prompt });
  });
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT_DRIVE_AUTH')), 20000));
  return Promise.race([attempt, timeout]);
}
async function findOrCreateFolder(name, parentId, token) {
  const parentClause = parentId ? ` and '${parentId}' in parents` : " and 'root' in parents";
  const qStr = encodeURIComponent(`name = '${name.replace(/'/g, "\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false${parentClause}`);
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${qStr}&fields=files(id,name)`, { headers: { Authorization: `Bearer ${token}` } });
  if (!searchRes.ok) { const err = new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ: ' + searchRes.status); err.status = searchRes.status; throw err; }
  const searchData = await searchRes.json();
  if (searchData.files && searchData.files.length > 0) return searchData.files[0].id;
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: parentId ? [parentId] : undefined })
  });
  if (!createRes.ok) { const err = new Error('สร้างโฟลเดอร์ไม่สำเร็จ: ' + createRes.status); err.status = createRes.status; throw err; }
  return (await createRes.json()).id;
}
async function getPhotoFolderId(token) {
  if (driveFolderCache.root) return driveFolderCache.root;
  const rootId = await findOrCreateFolder('PEA App - รูปการละเมิดลักใช้ไฟ', null, token);
  driveFolderCache.root = rootId;
  return rootId;
}
async function uploadPhotoToDrive(file, token, folderId, ticketId) {
  const metadata = { name: `${ticketId}_${Date.now()}_${file.name}`, parents: [folderId] };
  const boundary = 'vltAppBoundary' + Date.now();
  const metaBytes = new TextEncoder().encode(`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`);
  const filePartHeader = new TextEncoder().encode(`--${boundary}\r\nContent-Type: ${file.type || 'image/jpeg'}\r\n\r\n`);
  const closeBytes = new TextEncoder().encode(`\r\n--${boundary}--`);
  const fileBuffer = await file.arrayBuffer();
  const body = new Blob([metaBytes, filePartHeader, fileBuffer, closeBytes]);
  const uploadRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
    method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': `multipart/related; boundary=${boundary}` }, body
  });
  if (!uploadRes.ok) { const err = new Error('อัปโหลดไม่สำเร็จ: ' + uploadRes.status); err.status = uploadRes.status; throw err; }
  const uploaded = await uploadRes.json();
  await fetch(`https://www.googleapis.com/drive/v3/files/${uploaded.id}/permissions`, {
    method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ role: 'reader', type: 'anyone' })
  }).catch(() => {});
  return uploaded;
}
function isLikelyBlockedForDriveAuth() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const ua = navigator.userAgent || '';
  return standalone || /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua);
}
async function fetchDriveAccountEmail(token) {
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return null;
    return (await res.json()).email || null;
  } catch (e) { return null; }
}
function renderDriveAccountInfo() {
  const el = document.getElementById('drive-account-info');
  if (!el) return;
  if (driveAccountEmail) {
    el.innerHTML = `🔗 เชื่อมต่อ Google Drive บัญชี: <b>${esc(driveAccountEmail)}</b> ✓ (รูปจะถูกเก็บในไดรฟ์ของบัญชีนี้) · <span class="link-btn" onclick="switchDriveAccount()">เปลี่ยนบัญชี</span>`;
  } else if (driveAccessToken) {
    el.innerHTML = `🔗 เชื่อมต่อ Google Drive แล้ว · <span class="link-btn" onclick="switchDriveAccount()">เปลี่ยนบัญชี</span>`;
  } else {
    el.textContent = 'ยังไม่ได้เชื่อมต่อ Google Drive (จะขอสิทธิ์ตอนกดปุ่ม "ถ่ายรูป"/"เลือกรูป" ครั้งแรก — ใช้บัญชี Google ส่วนตัวของคุณได้เลย)';
  }
}
window.renderDriveAccountInfo = renderDriveAccountInfo;

async function switchDriveAccount() {
  driveAccessToken = null; driveAccountEmail = null; driveFolderCache = {};
  renderDriveAccountInfo();
  const statusEl = document.getElementById('photo-upload-status');
  statusEl.className = 'upload-status uploading'; statusEl.textContent = '🔄 กำลังเลือกบัญชี Google...';
  try {
    const token = await requestDriveAccessToken('select_account');
    driveAccountEmail = await fetchDriveAccountEmail(token);
    try { localStorage.setItem('vlt_drive_email', driveAccountEmail || ''); } catch (e) {}
    statusEl.className = 'upload-status'; statusEl.textContent = '';
    renderDriveAccountInfo();
    showToast('เปลี่ยนบัญชีสำเร็จ ✓');
  } catch (e) {
    statusEl.className = 'upload-status error'; statusEl.textContent = '⚠️ เปลี่ยนบัญชีไม่สำเร็จ ลองใหม่อีกครั้ง';
  }
}
window.switchDriveAccount = switchDriveAccount;

async function ensureDriveAccess() {
  const statusEl = document.getElementById('photo-upload-status');
  const permBtn = document.getElementById('btn-request-permission');
  if (driveAccessToken && !isDriveTokenExpired()) { permBtn.style.display = 'none'; return true; }
  if (driveAccessToken && isDriveTokenExpired()) { driveAccessToken = null; try { localStorage.removeItem('vlt_drive_token'); } catch (e) {} }
  statusEl.className = 'upload-status uploading'; statusEl.textContent = '🔄 กำลังขอสิทธิ์เชื่อมต่อ Google Drive (บัญชีของคุณ)...';
  try {
    const token = await requestDriveAccessToken();
    driveAccountEmail = await fetchDriveAccountEmail(token);
    try { localStorage.setItem('vlt_drive_email', driveAccountEmail || ''); } catch (e) {}
    renderDriveAccountInfo();
    statusEl.className = 'upload-status'; statusEl.textContent = '';
    permBtn.style.display = 'none';
    return true;
  } catch (e) {
    statusEl.className = 'upload-status error';
    statusEl.textContent = e && e.message === 'TIMEOUT_DRIVE_AUTH'
      ? '⚠️ เชื่อมต่อ Google Drive ไม่สำเร็จ (หมดเวลารอ) ตรวจสอบว่าอนุญาต popup แล้วลองกดปุ่ม "ขอสิทธิ์" ด้านล่าง'
      : '⚠️ เชื่อมต่อ Google Drive ไม่สำเร็จ ลองกดปุ่ม "ขอสิทธิ์" ด้านล่างอีกครั้ง';
    permBtn.style.display = 'block';
    return false;
  }
}

async function onPhotoButtonClick() { if (await ensureDriveAccess()) document.getElementById('d-photo-input').click(); }
window.onPhotoButtonClick = onPhotoButtonClick;
async function onGalleryButtonClick() { if (await ensureDriveAccess()) document.getElementById('d-gallery-input').click(); }
window.onGalleryButtonClick = onGalleryButtonClick;
async function onRequestPermissionClick() { await ensureDriveAccess(); }
window.onRequestPermissionClick = onRequestPermissionClick;

function handlePhotoSelected(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  pendingPhotoFile = file;
  const preview = document.getElementById('d-photo-preview');
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  document.getElementById('photo-upload-status').className = 'upload-status';
  document.getElementById('photo-upload-status').textContent = '📎 เลือกรูปแล้ว (จะอัปโหลดขึ้น Drive ตอนกดบันทึก)';
  document.getElementById('btn-delete-photo').style.display = 'block';
}
window.handlePhotoSelected = handlePhotoSelected;

function deletePhoto() {
  if (!confirm('ลบรูปนี้ออกจากรายการหรือไม่?')) return;
  pendingPhotoFile = null;
  existingPhoto = { link: '', fileId: '' };
  document.getElementById('d-photo-preview').style.display = 'none';
  document.getElementById('btn-delete-photo').style.display = 'none';
  document.getElementById('photo-upload-status').textContent = '';
  showToast('ลบรูปแล้ว (กดบันทึกเพื่อยืนยัน)');
}
window.deletePhoto = deletePhoto;

// ══════════════════════════ SAVE / DELETE ══════════════════════════
async function saveTicket() {
  const name = document.getElementById('m-name').value.trim();
  if (!name) { showToast('⚠️ กรุณาค้นหาแล้วเลือกผู้ใช้ไฟ หรือกรอกชื่ออย่างน้อย 1 ช่อง'); return; }
  if (!violationTypeSelected) { showToast('⚠️ กรุณาเลือกประเภทการละเมิด'); return; }

  const saveBtn = document.querySelector('#edit-overlay .btn-primary');
  saveBtn.disabled = true; saveBtn.textContent = '💾 กำลังบันทึก...';

  try {
    const { doc, setDoc, collection } = window._fsLib;
    const id = editingId || doc(collection(window._db, 'violation_tickets')).id;
    const old = editingId ? (window.TICKETS || []).find(x => x.id === editingId) : null;

    // อัปโหลดรูปใหม่ (ถ้ามี) ก่อนบันทึกข้อมูล
    let photoLink = existingPhoto.link, photoFileId = existingPhoto.fileId;
    if (pendingPhotoFile) {
      const statusEl = document.getElementById('photo-upload-status');
      statusEl.className = 'upload-status uploading'; statusEl.textContent = '🔄 กำลังอัปโหลดรูป...';
      try {
        let token = driveAccessToken || await requestDriveAccessToken();
        let result;
        try {
          result = await uploadPhotoToDrive(pendingPhotoFile, token, await getPhotoFolderId(token), id);
        } catch (err) {
          if (err && err.status === 401) {
            driveAccessToken = null; try { localStorage.removeItem('vlt_drive_token'); } catch (e) {}
            token = await requestDriveAccessToken('');
            result = await uploadPhotoToDrive(pendingPhotoFile, token, await getPhotoFolderId(token), id);
          } else { throw err; }
        }
        photoLink = result.webViewLink; photoFileId = result.id;
        if (old && old.photoFileId && old.photoFileId !== photoFileId) {
          fetch(`https://www.googleapis.com/drive/v3/files/${old.photoFileId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } }).catch(() => {});
        }
        statusEl.className = 'upload-status'; statusEl.textContent = '📎 อัปโหลดรูปสำเร็จ';
      } catch (e) {
        statusEl.className = 'upload-status error';
        statusEl.textContent = '⚠️ อัปโหลดรูปไม่สำเร็จ ' + (e && e.message ? '(' + e.message + ')' : '');
        showToast('⚠️ อัปโหลดรูปไม่สำเร็จ — กรุณาลองใหม่ก่อนบันทึก');
        saveBtn.disabled = false; saveBtn.textContent = '💾 บันทึก';
        return;
      }
    }

    const ticket = {
      id,
      prefix: document.getElementById('m-prefix').value,
      customerName: name,
      customerSirname: document.getElementById('m-surname').value.trim(),
      addressNo: document.getElementById('m-addressno').value.trim(),
      moo: document.getElementById('m-moo').value.trim(),
      tumbol: document.getElementById('m-tumbol').value.trim(),
      amphoe: document.getElementById('m-amphoe').value.trim(),
      changwat: document.getElementById('m-changwat').value.trim(),
      ca: document.getElementById('m-ca').value.trim(),
      peaNo: document.getElementById('m-peano').value.trim(),
      mobile: document.getElementById('m-mobile').value.trim(),
      regLat: parseFloat(document.getElementById('m-lat').value) || null,
      regLng: parseFloat(document.getElementById('m-lng').value) || null,
      foundLat: currentGPS ? currentGPS.lat : (old ? (old.foundLat ?? null) : null),
      foundLng: currentGPS ? currentGPS.lng : (old ? (old.foundLng ?? null) : null),
      violationType: violationTypeSelected,
      violationOther: document.getElementById('violation-other-text').value.trim(),
      detectDate: document.getElementById('detect-date').value,
      status: document.getElementById('violation-status').value,
      notes: document.getElementById('violation-notes').value.trim(),
      isManualEntry: !document.getElementById('m-name').readOnly,
      photoLink: photoLink || '',
      photoFileId: photoFileId || '',
      createdAt: old ? (old.createdAt || Date.now()) : Date.now(),
      updatedAt: Date.now()
    };

    await setDoc(doc(window._db, 'violation_tickets', id), ticket);
    showToast('บันทึกสำเร็จ ✓');
    closeEditModal();
  } catch (e) {
    console.error(e);
    showToast('⚠️ บันทึกไม่สำเร็จ: ' + (e && e.message ? e.message : 'ไม่ทราบสาเหตุ'));
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = '💾 บันทึก';
  }
}
window.saveTicket = saveTicket;

async function deleteTicket() {
  if (!editingId) return;
  if (!confirm('ลบรายการละเมิดนี้ทั้งหมดหรือไม่? การลบไม่สามารถกู้คืนได้')) return;
  try {
    const t = (window.TICKETS || []).find(x => x.id === editingId);
    const { doc, deleteDoc } = window._fsLib;
    await deleteDoc(doc(window._db, 'violation_tickets', editingId));
    if (t && t.photoFileId && driveAccessToken) {
      fetch(`https://www.googleapis.com/drive/v3/files/${t.photoFileId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${driveAccessToken}` } }).catch(() => {});
    }
    showToast('ลบรายการแล้ว ✓');
    closeEditModal();
  } catch (e) {
    showToast('⚠️ ลบไม่สำเร็จ: ' + (e && e.message ? e.message : ''));
  }
}
window.deleteTicket = deleteTicket;

window.showFirestoreError = function (err) {
  showToast('⚠️ เชื่อมต่อฐานข้อมูลไม่สำเร็จ: ' + (err && err.message ? err.message : 'ตรวจสอบ Firestore Security Rules'));
};

// ══════════════════════════ MAP ══════════════════════════
function initMap() {
  window.leafletMap = L.map('map', { zoomControl: false }).setView([16.80, 99.98], 11);
  L.control.zoom({ position: 'bottomright' }).addTo(window.leafletMap);
  const LocateControl = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd: function () {
      const btn = L.DomUtil.create('button', 'leaflet-bar my-location-btn');
      btn.type = 'button'; btn.title = 'ตำแหน่งของฉัน'; btn.innerHTML = '📍';
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', () => locateMyPosition(btn));
      return btn;
    }
  });
  new LocateControl().addTo(window.leafletMap);
  window.mapTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(window.leafletMap);
  window.mapLayer = L.layerGroup().addTo(window.leafletMap);
  mapInited = true;
  renderMapMarkers();
}

function locateMyPosition(btn) {
  if (!navigator.geolocation) { showToast('⚠️ อุปกรณ์นี้ไม่รองรับ GPS'); return; }
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳'; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude, accuracy } = pos.coords;
    L.circleMarker([latitude, longitude], { radius: 8, color: '#fff', weight: 2, fillColor: '#3b9ede', fillOpacity: 1 }).addTo(window.leafletMap);
    L.circle([latitude, longitude], { radius: accuracy, color: '#3b9ede', weight: 1, fillOpacity: 0.1 }).addTo(window.leafletMap);
    window.leafletMap.setView([latitude, longitude], 16);
    if (btn) { btn.disabled = false; btn.innerHTML = '📍'; }
  }, err => {
    showToast('⚠️ ดึงตำแหน่งไม่สำเร็จ ตรวจสอบสิทธิ์การใช้ตำแหน่ง');
    if (btn) { btn.disabled = false; btn.innerHTML = '📍'; }
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function renderMapMarkers() {
  if (!mapInited) return;
  window.mapLayer.clearLayers();
  (window.TICKETS || []).forEach(t => {
    const lat = t.foundLat || t.regLat;
    const lng = t.foundLng || t.regLng;
    if (!lat || !lng) return;
    const color = STATUS_COLOR[t.status] || STATUS_COLOR.pending;
    const icon = L.divIcon({
      className: 'ticket-pin',
      html: `<div class="pin-body" style="background:${color}"><span>⚡</span></div>`,
      iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28]
    });
    L.marker([lat, lng], { icon }).addTo(window.mapLayer).bindPopup(`
      <b>${esc(fullName(t))}</b><br>
      ${esc(fullAddress(t)) || '-'}<br>
      <span class="popup-detail">⚠️ ${esc(t.violationType || '-')}</span><br>
      <span class="popup-detail">${STATUS_LABEL[t.status] || 'รอดำเนินการ'}</span>
      <div class="popup-actions">
        <button class="popup-btn detail" onclick="openEditModal('${escAttr(t.id)}')">รายละเอียด</button>
        <button class="popup-btn nav" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}','_blank')">นำทาง</button>
      </div>
    `, { maxWidth: 220 });
  });
}
window.renderMapMarkers = renderMapMarkers;

// เริ่มต้น: แสดงหน้ารายการ
renderDriveAccountInfo();
</script>
