<!DOCTYPE html>
<html lang="th">
<head>
<script>
(function(){
  var saved = localStorage.getItem('pea-theme');
  var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อัปเดตสถานะ Ticket - PEA</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1923">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1923;
  --surface: #162030;
  --surface2: #1e2d3d;
  --border: #2a3f55;
  --accent: #f5a623;
  --accent2: #e05c2a;
  --blue: #3b9ede;
  --green: #2ecc71;
  --red: #e74c3c;
  --yellow: #f39c12;
  --text: #e8f0f8;
  --text2: #a9bdd1;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Sarabun', sans-serif;
}
html[data-theme="light"] {
  --bg:#e7ebf1;
  --surface:#ffffff;
  --surface2:#e3e8f0;
  --border:#d2dae4;
  --accent:#d97f0a;
  --text:#131f2b;
  --text2:#5b6b7d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size:15px; min-height: 100vh;
}
.card {
  background: var(--surface); width: 100%;
}
.card-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 600; background: var(--surface);
}
.header-back {
  color: var(--text2); text-decoration: none; font-size:14px; font-weight: 600;
  display: flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 4px 2px;
}
.header-back:active { color: var(--accent); }
.logo-badge {
  background: var(--accent); color: #000; font-family: var(--mono); font-weight: 600;
  font-size:13px; padding: 4px 9px; border-radius: 4px; letter-spacing: 1px;
}
.card-title { font-size:15px; font-weight: 600; color: var(--text2); }
.card-body { padding: 20px 18px 40px; }

.state-loading, .state-error {
  text-align: center; padding: 40px 20px; color: var(--text2);
}
.state-error .icon { font-size:42px; margin-bottom: 12px; }
.state-error .msg { font-size:16px; font-weight: 600; color: var(--red); margin-bottom: 6px; }
.state-error .sub { font-size:13px; color: var(--text2); }

.ticket-id-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
}
.ticket-id { font-family: var(--mono); font-size:20px; font-weight: 600; color: var(--accent); }
.status-pill {
  font-size:13px; font-weight: 600; padding: 4px 11px; border-radius: 20px;
  display: inline-flex; align-items: center; gap: 5px;
}
.status-open { background: rgba(231,76,60,0.15); color: var(--red); }
.status-progress { background: rgba(243,156,18,0.15); color: var(--yellow); }
.status-done { background: rgba(46,204,113,0.15); color: var(--green); }

.info-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 22px; }
.info-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; }
.info-key { font-size:13px; color: var(--text2); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px; }
.info-val { font-size:14.5px; line-height: 1.45; }
.info-val.mono { font-family: var(--mono); }

.section-label { font-size:13px; color: var(--text2); margin-bottom: 10px; font-weight: 600; }

.status-buttons { display: flex; flex-direction: column; gap: 9px; margin-bottom: 8px; }
.status-btn {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  font-family: var(--sans); font-size:14.5px; font-weight: 600; padding: 13px 16px;
  border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  transition: all 0.15s ease;
}
.status-btn:active { transform: scale(0.98); }
.status-btn.current { border-color: var(--accent); background: rgba(245,166,35,0.1); }
.status-btn .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot-open { background: var(--red); }
.dot-progress { background: var(--yellow); }
.dot-done { background: var(--green); }
.status-btn .check { margin-left: auto; color: var(--accent); font-size:16px; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 12px 20px; border-radius: 10px; font-size:14px; z-index: 999;
  transition: transform 0.25s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }

.map-link {
  display: inline-flex; align-items: center; gap: 6px; color: var(--blue);
  text-decoration: none; font-size:13.5px; margin-top: 4px;
}

.repair-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
.field-group { margin-bottom: 20px; }
.field-label { font-size:13px; font-weight: 600; color: var(--text2); margin-bottom: 9px; }

.custom-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--sans); font-size:14px; padding: 11px 13px; border-radius: 9px;
  margin-top: 8px; outline: none;
}
.custom-input:focus { border-color: var(--accent); }
.custom-input::placeholder { color: var(--text2); }

.select-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--sans); font-size:14px; padding: 11px 13px; border-radius: 9px;
  outline: none; appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23a9bdd1' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 13px center;
}
.select-input:focus { border-color: var(--accent); }
.mini-label { font-size:12.5px; color: var(--text2); margin: 10px 0 4px; }
.mini-label:first-of-type { margin-top: 2px; }

/* ===== Picker box (สรุปรายการที่เลือก, แตะเพื่อเปิด popup) ===== */
.picker-box {
  border: 1px solid var(--border); background: var(--surface2); border-radius: 10px;
  padding: 13px 15px; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; gap: 10px; transition: border-color 0.15s ease;
}
.picker-box:active { border-color: var(--accent); }
.picker-text { font-size:14px; line-height: 1.5; }
.picker-text.empty { color: var(--text2); }
.picker-plus {
  width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #000;
  display: flex; align-items: center; justify-content: center; font-size:16px; flex-shrink: 0;
  font-weight: 700;
}
.equip-tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.equip-tag {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size:11.5px;
  background: var(--bg); border: 1px solid var(--border); padding: 3px 4px 3px 9px; border-radius: 12px;
}
.equip-tag .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.equip-tag-remove {
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: var(--surface2); color: var(--text2); font-size:13px; line-height: 1;
  border: none; font-family: var(--sans); cursor: pointer;
}
.equip-tag-remove:active { background: var(--red); color: #fff; }

/* ===== Fullscreen popup picker ===== */
.popup-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 500;
}
.popup-overlay.show { display: block; }
.popup-sheet {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; top: 8%;
  background: var(--surface); border-radius: 18px 18px 0 0; z-index: 501;
  flex-direction: column; max-width: 460px; margin: 0 auto;
}
.popup-sheet.show { display: flex; }
.popup-header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.popup-title { font-size:16px; font-weight: 700; margin-bottom: 12px; }
.popup-search-row { display: flex; gap: 8px; }
.popup-search {
  flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  font-family: var(--sans); font-size:14px; padding: 11px 14px; border-radius: 10px; outline: none;
}
.popup-search:focus { border-color: var(--accent); }
.popup-add-btn {
  flex-shrink: 0; background: var(--accent); color: #000; border: none;
  font-family: var(--sans); font-size:13.5px; font-weight: 700; padding: 0 16px;
  border-radius: 10px; cursor: pointer;
}
.popup-add-btn:active { opacity: 0.8; }
.popup-list { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
.popup-item-wrap { border-bottom: 1px solid rgba(255,255,255,0.04); }
.popup-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer;
}
.popup-item:active { background: var(--surface2); }
.popup-checkbox {
  width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 5px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size:13px;
  color: #000;
}
.popup-item.checked .popup-checkbox { background: var(--accent); border-color: var(--accent); }
.popup-item.checked { background: rgba(245,166,35,0.06); }
.popup-item-label { font-size:14.5px; flex: 1; }
.popup-empty { padding: 24px 18px; color: var(--text2); font-size:13.5px; text-align: center; }

/* แถวจำนวน/หน่วย ของวัสดุ ที่แทรกใต้รายการที่ติ๊กแล้ว */
.popup-qty-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 18px 12px 54px;
}
.popup-qty-row input[type="number"] {
  width: 64px; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size:14px; padding: 7px 6px; border-radius: 6px;
  text-align: center; outline: none;
}
.popup-qty-row input[type="number"]:focus { border-color: var(--accent); }
.popup-qty-row input[type="text"] {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  font-family: var(--sans); font-size:14px; padding: 7px 10px; border-radius: 6px;
  outline: none;
}
.popup-qty-row input[type="text"]:focus { border-color: var(--accent); }
.size-dropdown { position: relative; flex: 1; min-width: 0; }
.size-dropdown-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  font-family: var(--sans); font-size:14px; padding: 7px 10px; border-radius: 6px;
  outline: none; cursor: pointer; text-align: left;
}
.size-dropdown-btn span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.size-dropdown-btn svg { flex-shrink:0; color: var(--text2); transition: transform .15s; }
.size-dropdown.open .size-dropdown-btn { border-color: var(--accent); }
.size-dropdown.open .size-dropdown-btn svg { transform: rotate(180deg); }
.size-dropdown-menu {
  position: fixed; z-index: 3000; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); overflow-y: auto; max-height: 260px;
  padding: 4px;
}
.size-dropdown-option {
  padding: 11px 14px; font-size:14px; color: var(--text); border-radius: 7px; cursor: pointer;
}
.size-dropdown-option:active { background: var(--surface2); }
.size-dropdown-option.active { background: rgba(245,166,35,0.15); color: var(--accent); font-weight:600; }
.popup-qty-row .qty-unit { font-size:13px; color: var(--text2); }
.popup-qty-row .size-row-add {
  background: none; border: 1px dashed var(--border); color: var(--accent);
  font-family: var(--sans); font-size:13px; font-weight:600; padding: 7px 12px; border-radius: 6px;
  cursor: pointer;
}
.popup-qty-row .size-row-remove {
  background: none; border: 1px solid var(--border); color: var(--text2);
  width:30px; height:30px; flex-shrink:0; border-radius: 6px; font-size:14px; cursor: pointer;
}
.popup-qty-row .size-row-remove:active { border-color: var(--red); color: var(--red); }

.popup-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.popup-clear { color: var(--text2); font-size:14px; background:none; border:none; cursor:pointer; padding: 8px; }
.popup-done { color: var(--accent); font-size:15px; font-weight: 700; background:none; border:none; cursor:pointer; padding: 8px; }

.save-btn {
  width: 100%; background: var(--blue); color: #fff; border: none;
  font-family: var(--sans); font-size:14.5px; font-weight: 600; padding: 13px;
  border-radius: 10px; cursor: pointer; margin-top: 18px;
}
.save-btn:active { transform: scale(0.98); }
.save-btn:disabled { opacity: 0.6; }

.job-btn { background: var(--green); margin-top: 10px; }
.etr-btn { background: var(--accent2); margin-top: 10px; }
.etr-btn-row { display:flex; gap:8px; margin-top:14px; }
.etr-btn-row .etr-pill {
  flex:1 1 0; min-width:0; border:none; border-radius:10px; padding:11px 8px;
  font-family: var(--sans); font-size:13.5px; font-weight:700; color:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:5px; text-align:center;
}
.etr-btn-row .etr-pill:active { transform: scale(0.98); }
.etr-btn-row .etr-pill:disabled { opacity:0.45; cursor:not-allowed; }
.etr-pill-outage { background:#c0392b; }
.etr-pill-restore { background:var(--accent2); }
.autosave-indicator {
  text-align:center; font-size:12px; color: var(--text2); min-height:16px; margin-top:8px; transition: opacity 0.3s;
}
.autosave-indicator.saving { color: var(--accent); }
.autosave-indicator.saved { color: var(--green); }
.etr-hint { font-size:12.5px; color: var(--text2); margin-top: 8px; line-height: 1.5; }
.etr-preview-textarea {
  width:100%; min-height:280px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size:13px; line-height:1.6;
  border-radius: 10px; padding: 13px; outline: none; resize: vertical;
}
.etr-preview-textarea:focus { border-color: var(--accent2); }
.etr-footer-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex:1; }
.etr-footer-actions .popup-done { padding: 8px 12px; }
.job-link-btn {
  width: 100%; background: var(--surface2); color: var(--accent); border: 1px solid var(--accent);
  font-family: var(--sans); font-size:14.5px; font-weight: 600; padding: 13px;
  border-radius: 10px; margin-top: 10px; text-decoration: none; display: block; text-align: center;
}
.job-link-btn:active { transform: scale(0.98); }
.job-hint {
  font-size:12.5px; color: var(--text2); margin-top: 9px; text-align: center; line-height: 1.5;
}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <a class="header-back" href="incident.html" id="header-back-link" onclick="goBackSmart(event)">← กลับ</a>
    <span class="logo-badge">PEA</span>
    <span class="card-title">อัปเดตสถานะแจ้งเหตุไฟดับ</span>
  </div>
  <div class="card-body" id="card-body">
    <div class="state-loading">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="popup-overlay" id="popup-overlay" onclick="closePicker()"></div>
<div class="popup-sheet" id="popup-sheet">
  <div class="popup-header">
    <div class="popup-title" id="popup-title">เลือกรายการ</div>
    <div class="popup-search-row">
      <input type="text" class="popup-search" id="popup-search" placeholder="ค้นหา หรือพิมพ์รายการใหม่..." oninput="filterPicker()">
      <button class="popup-add-btn" id="popup-add-btn" onclick="addCustomItem()">เพิ่ม</button>
    </div>
  </div>
  <div class="popup-list" id="popup-list"></div>
  <div class="popup-footer">
    <button class="popup-clear" onclick="clearPicker()">Clear</button>
    <button class="popup-done" onclick="closePicker()">Done</button>
  </div>
</div>

<div class="popup-overlay" id="etr-overlay" onclick="closeEtrPreview()"></div>
<div class="popup-sheet" id="etr-sheet">
  <div class="popup-header">
    <div class="popup-title" id="etr-sheet-title">📦 ตัวอย่างข้อความ ส่งกลุ่ม ETR</div>
  </div>
  <div style="padding:16px 18px; flex:1; overflow-y:auto;">
    <textarea class="etr-preview-textarea" id="etr-preview-text" placeholder="ข้อความจะแสดงที่นี่..."></textarea>
    <div class="etr-hint">แก้ไขข้อความก่อนส่งได้ตามต้องการ</div>
  </div>
  <div class="popup-footer">
    <button class="popup-clear" onclick="closeEtrPreview()">ปิด</button>
    <div class="etr-footer-actions">
      <button type="button" class="popup-done" id="etr-copy-btn">📋 คัดลอก</button>
      <button type="button" class="popup-done" id="etr-send-btn" style="color:var(--accent2)">เปิด LINE →</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, where, getDocs, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7bzImCV7c89fLGhIq8OycWKQWRYdvZvE",
    authDomain: "pea-system.firebaseapp.com",
    projectId: "pea-system",
    storageBucket: "pea-system.firebasestorage.app",
    messagingSenderId: "1006235611544",
    appId: "1:1006235611544:web:a7453d71ff56748166fbed",
    measurementId: "G-V5NPYZ4KZW"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);

  let selectedCauses = [];

    weather: { title: 'สภาพอากาศ', options: WEATHER_OPTIONS, hasQty: false, single: false, noCustom: true }
  };

  function getSelectedList(type) {
    if(type === 'cause') return selectedCauses;
    if(type === 'fix') return selectedFixes;
    if(type === 'technician') return selectedTechnician ? [selectedTechnician] : [];
    if(type === 'weather') return selectedWeather;
    return selectedMaterials.map(m => m.name);
  }

  function getCustomList(type) {
    if(type === 'cause') return customCauses;
    if(type === 'fix') return customFixes;
    if(type === 'technician' || type === 'weather') return [];
    // วัสดุ: รายการ custom คือชื่อใน selectedMaterials ที่ไม่ได้อยู่ใน preset
    return selectedMaterials.map(m => m.name);
  }

  function getAllOptions(type) {
    const base = PICKER_CONFIG[type].options;
    const customs = getCustomList(type).filter(c => !base.includes(c));
    return [...base, ...customs];
  }

  function isSelected(type, name) {
    return getSelectedList(type).includes(name);
  }

  function getMaterialUnit(name) {
    const preset = MATERIAL_OPTIONS.find(m => m.name === name);
    if(preset) return preset.unit;
    const existing = selectedMaterials.find(m => m.name === name);
    return existing ? existing.unit : 'หน่วย';
  }

  function materialHasSize(name) {
    const preset = MATERIAL_OPTIONS.find(m => m.name === name);
    return !!(preset && preset.sizes);
  }

  function getMaterialSizes(name) {
    const preset = MATERIAL_OPTIONS.find(m => m.name === name);
    return (preset && preset.sizes) || [];
  }

  function toggleSelection(type, name) {
    if(type === 'material') {
      const idx = selectedMaterials.findIndex(m => m.name === name);
      if(idx >= 0) {
        selectedMaterials.splice(idx, 1);
      } else {
        const item = { name, unit: getMaterialUnit(name) };
        if(materialHasSize(name)) {
          item.sizeBreakdown = [{ size:'', qty:1 }]; // รองรับหลายขนาดในวัสดุเดียวกัน (เช่น ฟิวส์แรงสูง 10K + 15K ในเหตุการณ์เดียว)
        } else {
          item.qty = 1;
        }
        selectedMaterials.push(item);
      }
      return;
    }
    if(type === 'technician') {
      selectedTechnician = (selectedTechnician === name) ? '' : name;
      return;
    }
    if(type === 'weather') {
      const idx = selectedWeather.indexOf(name);
      if(idx >= 0) selectedWeather.splice(idx, 1); else selectedWeather.push(name);
      return;
    }
    const list = type === 'cause' ? selectedCauses : selectedFixes;
    const idx = list.indexOf(name);
    if(idx >= 0) list.splice(idx, 1); else list.push(name);
  }

  function updateMaterialQty(name, qty) {
    const m = selectedMaterials.find(x => x.name === name);
    if(m) m.qty = isNaN(qty) ? 0 : qty;
  }

  // ── จัดการรายการขนาดย่อยของวัสดุที่มีหลายขนาด (sizeBreakdown) ──
  function updateSizeRowSize(name, idx, size) {
    const m = selectedMaterials.find(x => x.name === name);
    if(m && m.sizeBreakdown && m.sizeBreakdown[idx]) m.sizeBreakdown[idx].size = size;
  }

  function updateSizeRowQty(name, idx, qty) {
    const m = selectedMaterials.find(x => x.name === name);
    if(m && m.sizeBreakdown && m.sizeBreakdown[idx]) m.sizeBreakdown[idx].qty = isNaN(qty) ? 0 : qty;
  }

  function addSizeRow(name) {
    const m = selectedMaterials.find(x => x.name === name);
    if(m) {
      if(!m.sizeBreakdown) m.sizeBreakdown = [];
      m.sizeBreakdown.push({ size:'', qty:1 });
    }
    renderPickerList();
  }

  function removeSizeRow(name, idx) {
    const m = selectedMaterials.find(x => x.name === name);
    if(!m || !m.sizeBreakdown) return;
    m.sizeBreakdown.splice(idx, 1);
    if(m.sizeBreakdown.length === 0) {
      // ลบขนาดสุดท้ายออก = ยกเลิกเลือกวัสดุนี้ไปเลย
      const mi = selectedMaterials.findIndex(x => x.name === name);
      if(mi >= 0) selectedMaterials.splice(mi, 1);
    }
    renderPickerList();
  }

  function summaryText(type) {
    const list = getSelectedList(type);
    if(type === 'material') {
      return selectedMaterials.length
        ? selectedMaterials.map(m => {
            if(m.sizeBreakdown) {
              return m.sizeBreakdown.map(b => `${m.name}${b.size?' '+b.size:''} (${b.qty} ${m.unit})`).join(', ');
            }
            return `${m.name} (${m.qty} ${m.unit})`;
          }).join(', ')
        : '';
    }
    return list.join(', ');
  }

  function updateAllSummaries() {
    ['cause','fix','material','technician','weather'].forEach(type => {
      const el = document.getElementById('summary-' + type);
      if(!el) return;
      const text = summaryText(type);
      if(text) {
        el.textContent = text;
        el.classList.remove('empty');
      } else {
        el.textContent = 'ยังไม่ได้เลือก — แตะเพื่อเลือกรายการ';
        el.classList.add('empty');
      }
    });
    updateEquipmentSummary();
    renderJobActionArea();

  // ===== อุปกรณ์ที่ทำให้ไฟฟ้าขัดข้อง (เปิด equipment.html โหมดเลือก) =====
  function updateEquipmentSummary() {
    const textEl = document.getElementById('summary-equipment');
    const tagRow = document.getElementById('equip-tag-row');
    if(!textEl || !tagRow) return;
    if(selectedEquipment.length) {
      textEl.textContent = `เลือกแล้ว ${selectedEquipment.length} รายการ — แตะ 📍 เพื่อเพิ่ม หรือกด × เพื่อลบทีละรายการ`;
      textEl.classList.remove('empty');
      tagRow.innerHTML = selectedEquipment.map(eq => {
        const key = (eq.tp + ':' + eq.id).replace(/'/g, "\\'");

      }).join('');
    } else {
      textEl.textContent = 'ยังไม่ได้เลือก — แตะเพื่อเลือกอุปกรณ์บนแผนที่';
      textEl.classList.add('empty');
      tagRow.innerHTML = '';

  function openEquipmentPicker() {
    if(!ticketId) return;
    try {
      sessionStorage.setItem('equipmentPickerInit:' + ticketId, JSON.stringify(selectedEquipment));
    } catch(e) {}
    const returnUrl = encodeURIComponent(window.location.href);
    window.location.replace(`equipment.html?mode=pick&ticket=${encodeURIComponent(ticketId)}&return=${returnUrl}`);

  function removeEquipmentTag(e, key) {
    e.preventDefault();
    e.stopPropagation(); // กันไม่ให้ไปเปิด picker ซ้อน เพราะปุ่มนี้อยู่ใน picker-box ที่มี onclick เปิดหน้าเลือกอุปกรณ์
    selectedEquipment = selectedEquipment.filter(eq => (eq.tp + ':' + eq.id) !== key);

  function checkEquipmentPickerResult() {
    if(!ticketId) return;
    try {
      const raw = sessionStorage.getItem('equipmentPickerResult:' + ticketId);
      if(raw) {
        selectedEquipment = JSON.parse(raw);
        sessionStorage.removeItem('equipmentPickerResult:' + ticketId);
        updateEquipmentSummary();
        scheduleAutoSave();

  function openPicker(type) {
    currentPickerType = type;
    document.getElementById('popup-title').textContent = PICKER_CONFIG[type].title;
    document.getElementById('popup-search').value = '';
    const noCustom = !!PICKER_CONFIG[type].noCustom;
    document.getElementById('popup-add-btn').style.display = noCustom ? 'none' : '';
    document.getElementById('popup-overlay').classList.add('show');
    document.getElementById('popup-sheet').classList.add('show');
    renderPickerList();
  }

  function closePicker() {
    document.getElementById('popup-overlay').classList.remove('show');
    document.getElementById('popup-sheet').classList.remove('show');
    currentPickerType = null;
    updateAllSummaries();
    scheduleAutoSave();

  function clearPicker() {
    if(!currentPickerType) return;
    if(currentPickerType === 'material') selectedMaterials = [];
    else if(currentPickerType === 'cause') selectedCauses = [];
    else if(currentPickerType === 'fix') selectedFixes = [];
    else if(currentPickerType === 'technician') selectedTechnician = '';
    else if(currentPickerType === 'weather') selectedWeather = [];
    renderPickerList();
  }

  function filterPicker() {
    renderPickerList();
  }

  function renderPickerList() {
    const type = currentPickerType;
    if(!type) return;
    const query = document.getElementById('popup-search').value.trim().toLowerCase();
    const allOptions = getAllOptions(type);
    const filtered = allOptions.filter(opt => opt.toLowerCase().includes(query));
    const listEl = document.getElementById('popup-list');
    const hasQty = PICKER_CONFIG[type].hasQty;

    if(!filtered.length) {
      const canAddNew = query.length > 0;
      listEl.innerHTML = `<div class="popup-empty">ไม่พบรายการ${canAddNew?' — กดปุ่ม "เพิ่ม" ด้านบนเพื่อเพิ่ม "'+escapeHtml(query)+'"':''}</div>`;
      return;
    }

    listEl.innerHTML = filtered.map(opt => {
      const checked = isSelected(type, opt);
      const qtyRow = (hasQty && checked) ? (() => {
        const m = selectedMaterials.find(x => x.name === opt);
        if(materialHasSize(opt)) {
          const sizeOpts = getMaterialSizes(opt);
          const rows = m.sizeBreakdown.map((b, idx) => `
            <div class="popup-qty-row">
              <div class="size-dropdown" data-size-for="${escapeAttr(opt)}" data-idx="${idx}">
                <button type="button" class="size-dropdown-btn">
                  <span>${b.size ? escapeHtml(b.size) : 'เลือกขนาด'}</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="size-dropdown-menu" hidden>
                  ${sizeOpts.map(s => `<div class="size-dropdown-option ${b.size===s?'active':''}" data-value="${escapeAttr(s)}">${escapeHtml(s)}</div>`).join('')}
                </div>
              </div>
              <input type="number" min="0" step="0.1" value="${b.qty}" data-qty-for="${escapeAttr(opt)}" data-idx="${idx}" style="width:70px;flex-shrink:0">
              <span class="qty-unit">${escapeHtml(m.unit)}</span>
              ${m.sizeBreakdown.length > 1 ? `<button type="button" class="size-row-remove" data-remove-for="${escapeAttr(opt)}" data-idx="${idx}">✕</button>` : ''}
            </div>`).join('');
          return rows + `<div class="popup-qty-row"><button type="button" class="size-row-add" data-add-for="${escapeAttr(opt)}">+ เพิ่มขนาด</button></div>`;
        }
        return `<div class="popup-qty-row">
          <input type="number" min="0" step="0.1" value="${m.qty}" data-qty-for="${escapeAttr(opt)}">
          <span class="qty-unit">${escapeHtml(m.unit)}</span>
        </div>`;
      })() : '';
      return `
        <div class="popup-item-wrap">
          <div class="popup-item ${checked?'checked':''}" data-item="${escapeAttr(opt)}">
            <div class="popup-checkbox">${checked?'✓':''}</div>
            <div class="popup-item-label">${escapeHtml(opt)}</div>
          </div>
          ${qtyRow}
        </div>
      `;
    }).join('');

    listEl.querySelectorAll('.popup-item').forEach(row => {
      row.addEventListener('click', () => {
        toggleSelection(type, row.dataset.item);
        if(PICKER_CONFIG[type].single) {
          closePicker(); // เลือกได้รายการเดียว — เลือกแล้วปิดหน้าต่างทันที เหมือน dropdown
        } else {
          renderPickerList();
        }
      });
    });
    listEl.querySelectorAll('[data-qty-for]').forEach(inp => {
      inp.addEventListener('click', e => e.stopPropagation());
      inp.addEventListener('input', () => {
        if(inp.dataset.idx !== undefined) {
          updateSizeRowQty(inp.dataset.qtyFor, parseInt(inp.dataset.idx,10), parseFloat(inp.value));
        } else {
          updateMaterialQty(inp.dataset.qtyFor, parseFloat(inp.value));
        }
      });
    });
    listEl.querySelectorAll('.size-dropdown').forEach(dd => {
      const btn = dd.querySelector('.size-dropdown-btn');
      const menu = dd.querySelector('.size-dropdown-menu');
      btn.addEventListener('click', e => {
        e.stopPropagation();
        closeAllSizeDropdowns();
        const r = btn.getBoundingClientRect();
        menu.style.left = r.left + 'px';
        menu.style.top = (r.bottom + 4) + 'px';
        menu.style.width = r.width + 'px';
        // ถ้าเมนูจะล้นขอบล่างจอ ให้เปิดขึ้นด้านบนปุ่มแทน
        const estHeight = Math.min(260, menu.children.length * 44 + 8);
        if (r.bottom + 4 + estHeight > window.innerHeight) {
          menu.style.top = (r.top - estHeight - 4) + 'px';
        }
        menu.hidden = false;
        dd.classList.add('open');
      });
      menu.querySelectorAll('.size-dropdown-option').forEach(opt => {
        opt.addEventListener('click', e => {
          e.stopPropagation();
          updateSizeRowSize(dd.dataset.sizeFor, parseInt(dd.dataset.idx,10), opt.dataset.value);
          btn.querySelector('span').textContent = opt.dataset.value;
          menu.querySelectorAll('.size-dropdown-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          closeAllSizeDropdowns();
        });
      });
    });
    listEl.querySelectorAll('[data-add-for]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        addSizeRow(btn.dataset.addFor);
      });
    });
    listEl.querySelectorAll('[data-remove-for]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        removeSizeRow(btn.dataset.removeFor, parseInt(btn.dataset.idx,10));
      });
    });
  }

  function closeAllSizeDropdowns() {
    document.querySelectorAll('.size-dropdown-menu').forEach(m => m.hidden = true);
    document.querySelectorAll('.size-dropdown.open').forEach(d => d.classList.remove('open'));
  }
  document.addEventListener('click', closeAllSizeDropdowns);
  document.addEventListener('scroll', closeAllSizeDropdowns, true);

  function addCustomItem() {
    if(!currentPickerType) return;
    if(PICKER_CONFIG[currentPickerType].noCustom) return; // รายการนี้เป็นรายชื่อ/หมวดที่กำหนดตายตัว ห้ามพิมพ์เพิ่มเอง
    const searchInput = document.getElementById('popup-search');
    const val = searchInput.value.trim();
    if(!val) return;
    const type = currentPickerType;
    if(getAllOptions(type).includes(val)) {
      // มีอยู่แล้ว แค่ติ๊กเลือกให้แทนที่จะเพิ่มซ้ำ
      if(!isSelected(type, val)) toggleSelection(type, val);
      searchInput.value = '';
      renderPickerList();
      return;
    }
    if(type === 'cause') customCauses.push(val);
    else if(type === 'fix') customFixes.push(val);

    renderPickerList();

  window.addCustomItem = addCustomItem;

  // กด Enter ในช่องค้นหา = เพิ่มรายการใหม่ (ปุ่ม "เพิ่ม" ข้างๆ คือทางหลักที่เชื่อถือได้บนมือถือทุกรุ่น
  // ส่วน Enter เป็นทางลัดเสริมสำหรับคีย์บอร์ดที่รายงาน key event ถูกต้อง)
  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('popup-search');
    if(searchInput) {
      searchInput.addEventListener('keyup', (e) => {
        if(e.key !== 'Enter' || !currentPickerType) return;
        e.preventDefault();
        addCustomItem();
      });
    }
  });

  // ===== สร้างใบงานสับเปลี่ยนมิเตอร์ใน U-cube (จากงานแจ้งเหตุที่จบด้วยการเปลี่ยนมิเตอร์) =====
  const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

  // ครอบคลุมทั้ง preset "เปลี่ยนมิเตอร์" และข้อความที่ช่างพิมพ์เอง เช่น "สับเปลี่ยนมิเตอร์"
  function isMeterSwapFix(text) {
    if (!text) return false;
    return (text.includes('เปลี่ยน') || text.includes('สับเปลี่ยน')) && text.includes('มิเตอร์');
  }

  function hasMeterSwapFix(list) {
    return (list || []).some(isMeterSwapFix);
  }

  function generateAdhocReqNo() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const ymd = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}`;
    const rand = Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase();
    return `ADHOC-${ymd}-${rand}`;
  }

  function formatNowDateTimeTH() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()+543} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  // แสดงพื้นที่ปุ่ม 2 สถานะ: (1) ยังไม่เคยสร้างใบงาน → ปุ่มสร้าง (โชว์ตลอด ไม่พึ่งเงื่อนไขวิธีแก้ไข/บันทึกก่อน)
  // (2) สร้างไปแล้ว → ลิงก์ดูใบงาน (กันสร้างซ้ำ)
  // หมายเหตุ: ขนาดมิเตอร์ (meterSizeCode) ตอนสร้าง ticket จะ auto-fill ด้วยขนาดมิเตอร์เดิมจาก CIS (ampfromcis + metertype)
  // เพราะงานสับเปลี่ยนปกติต้องใช้มิเตอร์ตัวใหม่ขนาดเท่าเดิม — ถ้าเป็นงาน "เพิ่มขนาดมิเตอร์" (เช่น 5A → 15A/30A) ช่างต้องแก้ไขค่านี้เองหน้างานแทน
  function renderJobActionArea() {
    const area = document.getElementById('job-action-area');
    if (!area || !currentData) return;

    if (currentData.ucubeReqNo) {
      area.innerHTML = `<a class="job-link-btn" href="${BASE_URL}ucube.html?open=${encodeURIComponent(currentData.ucubeReqNo)}">📋 ดูใบงานสับเปลี่ยนมิเตอร์ใน U-cube (${escapeHtml(currentData.ucubeReqNo)})</a>`;
      return;
    }

    area.innerHTML = `<button class="save-btn job-btn" id="create-job-btn">🔁 สร้างใบงานสับเปลี่ยนมิเตอร์ใน U-cube</button>`;
    document.getElementById('create-job-btn').addEventListener('click', createSwapJob);
  }

  async function createSwapJob() {
    const btn = document.getElementById('create-job-btn');
    if (!btn || !currentData) return;
    if (!confirm('แน่ใจนะว่าเป็นงานสับเปลี่ยนมิเตอร์')) return;
    btn.disabled = true;
    btn.textContent = 'กำลังสร้างใบงาน...';

    const now = new Date();
    const batchMonth = now.getMonth() + 1;
    const batchYear = now.getFullYear() + 543;
    const batchKey = `${batchYear}-${String(batchMonth).padStart(2, '0')}`;
    const batchLabel = `${THAI_MONTHS[batchMonth - 1]} ${batchYear}`;
    const reqNo = generateAdhocReqNo();

    const oldMeterSizeRef = currentData.ampfromcis
      ? currentData.ampfromcis + 'A' + (currentData.metertype && currentData.metertype !== '—' ? ' (' + currentData.metertype + ')' : '')
      : '';

    const detailParts = [
      currentData.note,
      (currentData.causes || []).length ? 'สาเหตุ: ' + currentData.causes.join(', ') : '',
      (currentData.fixes || []).length ? 'วิธีแก้ไขหน้างานเดิม: ' + currentData.fixes.join(', ') : ''
    ].filter(Boolean);

    const ticket = {
      reqNo, jobDate: formatNowDateTimeTH(), mru: '', userno: '',
      peanoMeter: currentData.peano && currentData.peano !== '—' ? currentData.peano : '',
      meterSizeCode: oldMeterSizeRef, oldMeterSizeRef, referenceUnit: '',
      customerName: currentData.name || '', locationAddress: currentData.addr || '',
      anotherDetail: detailParts.join(' - '),
      lat: currentData.lat || 0, lng: currentData.lng || 0,
      batchMonth, batchYear, batchKey, batchLabel,
      status: 'broken', reasons: currentData.causes || [],
      checkDate: '', unitRead: '', newMeterNo: '', newUnitRead: '',
      photoLink: '', photoThumb: '',
      source: 'incident', fromIncidentId: currentData.id || '',
      createdAt: Date.now(), updatedAt: Date.now()
    };

    try {
      await setDoc(doc(db, 'ucube_tickets', reqNo), ticket);
      await updateDoc(doc(db, 'tickets', currentDocId), { ucubeReqNo: reqNo });
      currentData.ucubeReqNo = reqNo;
      showToast('สร้างใบงานสับเปลี่ยนมิเตอร์ใน U-cube สำเร็จ ✓', 'success');
      renderJobActionArea();
    } catch (e) {
      console.error(e);
      showToast('สร้างใบงานไม่สำเร็จ กรุณาลองใหม่', 'error');
      btn.disabled = false;
      btn.textContent = '🔁 สร้างใบงานสับเปลี่ยนมิเตอร์ใน U-cube';
    }
  }

  let autoSaveTimer = null;

  function setAutoSaveIndicator(state) {
    const el = document.getElementById('autosave-indicator');
    if (!el) return;
    el.classList.remove('saving', 'saved');
    if (state === 'saving') {
      el.textContent = 'กำลังบันทึก...';
      el.classList.add('saving');
    } else if (state === 'saved') {
      el.textContent = 'บันทึกแล้ว ✓';
      el.classList.add('saved');
      setTimeout(() => { if (el.textContent === 'บันทึกแล้ว ✓') el.textContent = ''; }, 2000);
    } else if (state === 'error') {
      el.textContent = 'บันทึกไม่สำเร็จ — ลองอีกครั้ง';
    } else {
      el.textContent = '';
    }
  }

  async function performSave() {
    if (!currentDocId) return;
    try {
      await updateDoc(doc(db, "tickets", currentDocId), {
        causes: selectedCauses,
        customCauses,
        fixes: selectedFixes,
        customFixes,
        materials: selectedMaterials,
        equipment: selectedEquipment,

        outageTime,
        estimatedMinutes,
        estimatedRestoreTime,

      });

      currentData.outageTime = outageTime;

  // เรียกทุกครั้งที่มีการแก้ไขฟอร์ม — หน่วงเวลาไว้สั้นๆ (debounce) แล้วบันทึกอัตโนมัติ ไม่ต้องกดปุ่มบันทึกเอง
  function scheduleAutoSave() {
    setAutoSaveIndicator('saving');
    if (autoSaveTimer) clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(performSave, 700);
  }
  window.scheduleAutoSave = scheduleAutoSave;

  // ===== helper: ดึงเวลา HH:MM ออกจากสตริงเวลาสร้าง ticket (เช่น "22/8/2569 09:14:12") =====
  function extractTimeHHMM(str) {
    if (!str) return '';
    const m = String(str).match(/(\d{1,2}):(\d{2})/);
    if (!m) return '';
    return `${m[1].padStart(2,'0')}:${m[2]}`;
  }

  // ===== helper: บวกนาทีเข้ากับเวลา HH:MM =====
  function addMinutesToTimeStr(timeStr, minutes) {
    if (!timeStr) return '';
    const mins = parseInt(minutes, 10);
    if (isNaN(mins)) return '';
    const [h, m] = timeStr.split(':').map(Number);
    let total = (h * 60 + m + mins) % 1440;
    if (total < 0) total += 1440;
    const hh = String(Math.floor(total / 60)).padStart(2, '0');
    const mm = String(total % 60).padStart(2, '0');
    return `${hh}:${mm}`;
  }

  function recalcEstimatedRestoreTime() {
    if (!outageTime || estimatedMinutes === '') return;
    estimatedRestoreTime = addMinutesToTimeStr(outageTime, estimatedMinutes);
    const el = document.getElementById('estimated-restore-input');
    if (el) el.value = estimatedRestoreTime;
  }

    btn.disabled = currentData.status !== 'done';

  // ===== ข้อความรอบที่ 1: แจ้งเหตุไฟฟ้าขัดข้อง =====
  function buildOutageMessage() {
    const t = currentData || {};
    const equipStr = selectedEquipment.length
      ? selectedEquipment.map(eq => eq.id).join(', ')
      : '-';
    return `${ORG_NAME}
ขอแจ้งเหตุไฟฟ้าขัดข้อง
บริเวณ : ${t.addr || '-'}
รหัสอุปกรณ์ : ${equipStr}
ไฟดับเวลา : ${outageTime || '-'} น.
คาดว่าใช้เวลาแก้ไขภายใน : ${estimatedMinutes || '-'} นาที
คาดการณ์เวลาไฟติด : ${estimatedRestoreTime || '-'} น.
สภาพอากาศ : ${selectedWeather.length ? selectedWeather.join(', ') : '-'}
ชื่อช่างดำเนินการ : ${selectedTechnician || '-'}`;
  }

  // ===== ข้อความรอบที่ 2: แจ้งไฟติด + วัสดุที่ใช้ =====
  // แสดงเฉพาะวัสดุ/อุปกรณ์ที่ใช้ ตามรูปแบบข้อความตอบกลับแจ้งไฟติด
  function buildRestoreMessage() {
    const materials = (selectedMaterials && selectedMaterials.length)
      ? selectedMaterials.flatMap(m => {
          if (m.sizeBreakdown && m.sizeBreakdown.length) {
            return m.sizeBreakdown.map(b =>
              `${m.name}${b.size ? ' ' + b.size : ''} ${b.qty ?? 1} ${m.unit || ''}`.trim()
            );
          }
          return [`${m.name}${m.size ? ' ' + m.size : ''} ${m.qty ?? 1} ${m.unit || ''}`.trim()];
        })
      : [];

    const materialLines = materials.length
      ? materials.map((item, i) => `    ${item}${i < materials.length - 1 ? ',' : ''}`).join('\n')
      : '    -';

    return `จ่ายไฟใช้ได้ปกติ\nวัสดุ/อุปกรณ์ที่ใช้\n${materialLines}`;
  }

  // เปิด LINE โดยไม่รอ Clipboard API และไม่ใช้ window.open
  // เพื่อป้องกันอาการแอปค้างบน Android WebView/PWA
  function sendToEtrGroup(msg) {
    if (!msg) {
      showToast('ไม่มีข้อความสำหรับส่ง LINE', 'error');
      return;
    }

    let lineUrl;
    try {
      lineUrl = 'https://line.me/R/msg/text/?' + encodeURIComponent(msg);
    } catch (e) {
      console.error('สร้างลิงก์ LINE ไม่สำเร็จ:', e);
      showToast('สร้างลิงก์ LINE ไม่สำเร็จ', 'error');
      return;
    }

    closeEtrPreview();
    window.location.assign(lineUrl);
  }

  function openEtrOutagePreview() {
    if (!selectedTechnician) {
      showToast('กรุณาเลือกชื่อช่างผู้ดำเนินการก่อน', 'error');
      return;
    }
    if (!outageTime) {
      showToast('กรุณาระบุไฟดับเวลาก่อน', 'error');
      return;
    }
    document.getElementById('etr-sheet-title').textContent = '📦 ตัวอย่างข้อความ ส่งกลุ่ม ETR';
    document.getElementById('etr-preview-text').value = buildOutageMessage();
    document.getElementById('etr-overlay').classList.add('show');
    document.getElementById('etr-sheet').classList.add('show');
  }
  window.openEtrOutagePreview = openEtrOutagePreview;

  function openEtrRestorePreview() {
    if (currentData && currentData.status !== 'done') {
      showToast('กรุณาเปลี่ยนสถานะเป็น "แก้ไขแล้ว" ก่อน', 'error');
      return;
    }
    if (!selectedMaterials.length) {
      showToast('กรุณาเลือกวัสดุที่ใช้ก่อน', 'error');
      return;
    }
    if (!selectedTechnician) {
      showToast('กรุณาเลือกชื่อช่างผู้ดำเนินการก่อน', 'error');
      return;
    }
    document.getElementById('etr-sheet-title').textContent = '📦 ตัวอย่างข้อความ ตอบกลับแจ้งไฟติด';
    document.getElementById('etr-preview-text').value = buildRestoreMessage();
    document.getElementById('etr-overlay').classList.add('show');
    document.getElementById('etr-sheet').classList.add('show');
  }
  window.openEtrRestorePreview = openEtrRestorePreview;

  function closeEtrPreview() {
    document.getElementById('etr-overlay').classList.remove('show');
    document.getElementById('etr-sheet').classList.remove('show');
  }
  window.closeEtrPreview = closeEtrPreview;

  // คัดลอกแบบ synchronous เพื่อไม่ให้ Promise ของ Clipboard API ค้างใน WebView/PWA
  function copyTextSync(text) {
    const ta = document.createElement('textarea');
    ta.value = text || '';
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);

    let ok = false;
    try {
      ta.focus({ preventScroll: true });
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      ok = document.execCommand('copy');
    } catch (e) {
      console.warn('copy failed:', e);
    }

    // ไม่คืน focus/selection ให้ element เดิมหลัง copy
    // เพื่อไม่ทิ้ง selection state ไว้ก่อนการกด "เปิด LINE"
    try { ta.blur(); } catch (_) {}
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById('etr-copy-btn').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const msg = document.getElementById('etr-preview-text').value;
    if (copyTextSync(msg)) {
      showToast('คัดลอกข้อความแล้ว ✓', 'success');
    } else {
      showToast('คัดลอกไม่สำเร็จ', 'error');
    }
  });

  document.getElementById('etr-send-btn').addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const msg = document.getElementById('etr-preview-text').value;
    sendToEtrGroup(msg);
  });

  let currentDocId = null;
  let currentData = null;

  async function loadTicket() {
    if(!ticketId || !token) {
      renderError('ลิงก์ไม่ถูกต้อง', 'ไม่พบรหัส ticket หรือ token ใน URL กรุณาตรวจสอบลิงก์อีกครั้ง');
      return;
    }
    try {
      const q = query(collection(db, "tickets"), where("id", "==", ticketId));
      const snap = await getDocs(q);
      if(snap.empty) {
        renderError('ไม่พบ Ticket นี้', `รหัส ${ticketId} อาจถูกลบหรือไม่มีอยู่จริง`);
        return;
      }
      // หาก id ซ้ำกันหลาย ticket (เกิดจาก bug ตัวนับ id เดิม) ให้เลือกอันที่ token ตรงกับลิงก์จริงๆ
      // แทนที่จะหยิบตัวแรกที่เจอ ซึ่งอาจไม่ใช่ ticket ที่ลิงก์นี้ถูกสร้างมาให้
      const docSnap = snap.docs.find(d => d.data().token === token) || snap.docs[0];
      const data = docSnap.data();
      if(!data.token || data.token !== token) {
        renderError('ไม่มีสิทธิ์เข้าถึง', 'Token ไม่ถูกต้อง กรุณาใช้ลิงก์ที่ได้รับจากระบบเท่านั้น');
        return;
      }
      currentDocId = docSnap.id;
      currentData = data;
      // โหลดข้อมูลซ่อมบำรุงเดิม (ถ้ามี) เข้า state
      selectedCauses = data.causes || [];
      // รองรับข้อมูลเก่า: customCause เคยเป็น string เดี่ยว ตอนนี้เปลี่ยนเป็น customCauses array
      customCauses = data.customCauses || (data.customCause ? [data.customCause] : []);
      if(data.customCause && !selectedCauses.includes(data.customCause)) selectedCauses.push(data.customCause);
      selectedFixes = data.fixes || [];
      customFixes = data.customFixes || (data.customFix ? [data.customFix] : []);
      if(data.customFix && !selectedFixes.includes(data.customFix)) selectedFixes.push(data.customFix);
      // migrate ทิกเก็ตเก่า (รูปแบบ {name,unit,qty,size} เดี่ยว) ให้เข้ารูปแบบ sizeBreakdown ใหม่
      // เพื่อให้แก้ไข/แสดงผลในตัวเลือกแบบหลายขนาดได้ถูกต้อง
      selectedMaterials = (data.materials || []).map(m => {
        if (materialHasSize(m.name) && !m.sizeBreakdown) {
          return { name: m.name, unit: m.unit, sizeBreakdown: [{ size: m.size || '', qty: m.qty ?? 1 }] };
        }
        return m;
      });
      selectedEquipment = data.equipment || [];
      selectedTechnician = data.technician || '';
      // ค่าเริ่มต้น: ไฟดับเวลา = เวลาที่สร้าง ticket, ใช้เวลาแก้ไข 30 นาที, เวลาไฟติด = ไฟดับ+30 (ทั้งหมดแก้ไขเองได้)
      outageTime = data.outageTime || extractTimeHHMM(data.time) || '';
      estimatedMinutes = (data.estimatedMinutes !== undefined && data.estimatedMinutes !== '') ? data.estimatedMinutes : 30;
      estimatedRestoreTime = data.estimatedRestoreTime || addMinutesToTimeStr(outageTime, estimatedMinutes) || '';
      // สภาพอากาศ: รองรับทั้งข้อมูลเก่า (string) และใหม่ (array, เลือกได้หลายรายการ)
      selectedWeather = Array.isArray(data.weather) ? data.weather : (data.weather ? [data.weather] : []);
      checkEquipmentPickerResult(); // ถ้ากลับมาจาก equipment.html picker ให้ใช้ค่านั้นแทน (ใหม่กว่า)
      renderTicket(data);
    } catch(e) {
      console.error(e);
      renderError('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่อีกครั้ง');
    }
  }

  function renderTicket(t) {
    const statusClass = t.status === 'open' ? 'status-open' : t.status === 'progress' ? 'status-progress' : 'status-done';
    const mapLink = (t.lat && t.lng) ? `<a class="map-link" href="https://www.google.com/maps?q=${t.lat},${t.lng}" target="_blank">📍 เปิดแผนที่นำทาง</a>` : '';
    body.innerHTML = `
      <div class="ticket-id-row">
        <span class="ticket-id">${t.id}</span>
        <span class="status-pill ${statusClass}" id="status-pill">${statusLabel(t.status)}</span>
      </div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-key">ผู้แจ้ง</div>
          <div class="info-val">${t.name}</div>
        </div>
        <div class="info-item">
          <div class="info-key">CA / PEANO</div>
          <div class="info-val mono">${t.ca} / ${t.peano}</div>
        </div>
        <div class="info-item">
          <div class="info-key">ขนาดมิเตอร์</div>
          <div class="info-val mono">${t.ampfromcis ? t.ampfromcis + 'A' + (t.metertype && t.metertype !== '—' ? ' (' + t.metertype + ')' : '') : '—'}</div>
        </div>
        <div class="info-item">
          <div class="info-key">ที่อยู่</div>
          <div class="info-val">${t.addr}${mapLink}</div>
        </div>
        <div class="info-item">
          <div class="info-key">เหตุการณ์</div>
          <div class="info-val">${t.note}</div>
        </div>
        <div class="info-item">
          <div class="info-key">เบอร์โทรผู้แจ้ง</div>
          <div class="info-val mono">${t.tel || '—'}</div>
        </div>
      </div>
      <div class="section-label">เปลี่ยนสถานะ</div>
      <div class="status-buttons" id="status-buttons">
        ${renderStatusButtons(t.status)}
      </div>

      <div class="repair-section">
        <div class="field-group">
          <div class="field-label">สาเหตุที่ทำให้ไฟฟ้าขัดข้อง</div>
          <div class="picker-box" id="picker-cause" onclick="openPicker('cause')">
            <div class="picker-text" id="summary-cause"></div>
            <div class="picker-plus">+</div>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">⚡ อุปกรณ์ที่ทำให้ไฟฟ้าขัดข้อง</div>
          <div class="picker-box" id="picker-equipment" onclick="openEquipmentPicker()">
            <div style="flex:1">
              <div class="picker-text" id="summary-equipment"></div>
              <div class="equip-tag-row" id="equip-tag-row"></div>
            </div>
            <div class="picker-plus">📍</div>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">วิธีแก้ไข</div>
          <div class="picker-box" id="picker-fix" onclick="openPicker('fix')">
            <div class="picker-text" id="summary-fix"></div>
            <div class="picker-plus">+</div>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">วัสดุ/อุปกรณ์ที่ใช้</div>
          <div class="picker-box" id="picker-material" onclick="openPicker('material')">
            <div class="picker-text" id="summary-material"></div>
            <div class="picker-plus">+</div>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">👷 ชื่อช่างผู้ดำเนินการ</div>
          <div class="picker-box" id="picker-technician" onclick="openPicker('technician')">
            <div class="picker-text" id="summary-technician"></div>
            <div class="picker-plus">+</div>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">${LINE_ICON} ข้อมูลแจ้งเหตุไฟฟ้าขัดข้อง (ส่งกลุ่ม ETR รอบที่ 1)</div>
          <div class="mini-label">ไฟดับเวลา</div>
          <input type="time" class="custom-input" id="outage-time-input" value="${escapeAttr(outageTime)}">
          <div class="mini-label">คาดว่าใช้เวลาแก้ไขภายใน (นาที)</div>
          <input type="number" min="0" class="custom-input" id="estimated-minutes-input" placeholder="เช่น 30" value="${escapeAttr(estimatedMinutes)}">
          <div class="mini-label">คาดการณ์เวลาไฟติด (คำนวณอัตโนมัติ แก้ไขได้)</div>
          <input type="time" class="custom-input" id="estimated-restore-input" value="${escapeAttr(estimatedRestoreTime)}">
          <div class="mini-label">สภาพอากาศ</div>
          <div class="picker-box" id="picker-weather" onclick="openPicker('weather')">
            <div class="picker-text" id="summary-weather"></div>
            <div class="picker-plus">+</div>
          </div>
        </div>

        <div class="etr-btn-row">
          <button class="etr-pill etr-pill-outage" id="etr-outage-btn" type="button">${LINE_ICON}แจ้งไฟดับ (ETR)</button>
          <button class="etr-pill etr-pill-restore" id="etr-restore-btn" type="button" ${t.status !== 'done' ? 'disabled' : ''}>${LINE_ICON}แจ้งไฟติด (ETR)</button>
        </div>
        <div class="autosave-indicator" id="autosave-indicator"></div>

        <div id="job-action-area"></div>
      </div>
    `;
    attachButtonHandlers();
    updateAllSummaries();
    document.getElementById('outage-time-input').addEventListener('change', (e) => {
      outageTime = e.target.value;
      recalcEstimatedRestoreTime();
      scheduleAutoSave();
    });
    document.getElementById('estimated-minutes-input').addEventListener('input', (e) => {
      estimatedMinutes = e.target.value;
      recalcEstimatedRestoreTime();
      scheduleAutoSave();
    });
    document.getElementById('estimated-restore-input').addEventListener('change', (e) => {
      estimatedRestoreTime = e.target.value; // แก้ไขเองแล้ว ไม่ auto-overwrite ทับอีกจนกว่าจะเปลี่ยนเวลาไฟดับ/นาทีใหม่
      scheduleAutoSave();
    });
    document.getElementById('etr-outage-btn').addEventListener('click', openEtrOutagePreview);
    document.getElementById('etr-restore-btn').addEventListener('click', openEtrRestorePreview);
    updateEtrRestoreButtonState();
    renderJobActionArea();
  }

  function escapeAttr(s) {
    return String(s==null ? '' : s).replace(/"/g,'&quot;');
  }

  function escapeHtml(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderStatusButtons(current) {
    const opts = [
      {key:'open', dot:'dot-open', label:'รอดำเนินการ'},
      {key:'progress', dot:'dot-progress', label:'กำลังดำเนินการ'},
      {key:'done', dot:'dot-done', label:'แก้ไขแล้ว'}
    ];
    return opts.map(o => `
      <button class="status-btn ${o.key===current?'current':''}" data-status="${o.key}">
        <span class="dot ${o.dot}"></span>
        ${o.label}
        ${o.key===current?'<span class="check">✓</span>':''}
      </button>
    `).join('');
  }

  function attachButtonHandlers() {
    document.querySelectorAll('.status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newStatus = btn.dataset.status;
        if(newStatus === currentData.status) return;
        btn.disabled = true;
        try {
          await updateDoc(doc(db, "tickets", currentDocId), { status: newStatus });
          currentData.status = newStatus;
          document.getElementById('status-buttons').innerHTML = renderStatusButtons(newStatus);
          document.getElementById('status-pill').textContent = statusLabel(newStatus);
          document.getElementById('status-pill').className = 'status-pill ' + (newStatus==='open'?'status-open':newStatus==='progress'?'status-progress':'status-done');
          updateEtrRestoreButtonState();
          attachButtonHandlers();
          showToast('อัปเดตสถานะเรียบร้อย ✓', 'success');
        } catch(e) {
          console.error(e);
          showToast('อัปเดตไม่สำเร็จ กรุณาลองใหม่', 'error');
          btn.disabled = false;
        }
      });
    });
  }

  function attachRepairHandlers() {
    // เก็บไว้เป็น no-op เผื่อมีโค้ดอ้างอิงเก่า — logic จริงทั้งหมดย้ายไปอยู่ใน popup picker functions แล้ว
  }

  window.openPicker = openPicker;
  window.closePicker = closePicker;
  window.clearPicker = clearPicker;
  window.filterPicker = filterPicker;
  window.openEquipmentPicker = openEquipmentPicker;
  window.removeEquipmentTag = removeEquipmentTag;

  // ปุ่ม "← กลับ" ที่หัวการ์ด — ถ้ามี history (มาจาก incident.html ในแท็บเดิม) ให้กดถอยกลับตามปกติ
  // ถ้าไม่มี history เลย (เช่น เปิดลิงก์ตรงๆ จาก LINE/SMS ครั้งแรก) จึง fallback ไป incident.html โดยตรง
  window.goBackSmart = function(e) {
    e.preventDefault();
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = BASE_URL + 'incident.html';
    }
  };

  loadTicket();
</script>
