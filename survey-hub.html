<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานสำรวจระบบจำหน่าย - PEA</title>
<meta name="theme-color" content="#0f1923">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f1923; --surface:#162030; --surface2:#1e2d3d; --border:#2a3f55;
  --accent:#f5a623; --blue:#3b9ede; --green:#2ecc71; --red:#e74c3c;
  --text:#e8f0f8; --text2:#a9bdd1;
  --mono:'IBM Plex Mono',monospace; --sans:'Sarabun',sans-serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; min-height:100vh; }

.header {
  padding:14px 20px; display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--border);
}
.back-btn {
  color:var(--text2); text-decoration:none; font-size:13px;
  display:flex; align-items:center; gap:4px;
  padding:6px 10px; border:1px solid var(--border); border-radius:6px;
  flex-shrink:0;
}
.back-btn:hover { color:var(--accent); border-color:var(--accent); }
.header-title { font-size:16px; font-weight:700; flex:1; }

.menu-wrap { padding:16px; max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }

.menu-card {
  display:flex; align-items:center; gap:14px;
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; text-decoration:none; color:var(--text);
  border-left:3px solid transparent;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease;
}
.menu-card:active { transform:translateX(6px); background:var(--surface2); border-left-color:var(--accent); }
.menu-icon {
  width:44px; height:44px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:22px;
  background:rgba(245,166,35,0.15);
}
.menu-text { flex:1; min-width:0; }
.menu-title { font-size:15px; font-weight:600; margin-bottom:2px; }
.menu-sub { font-size:13px; color:var(--text2); }
.menu-arrow { color:var(--text2); font-size:18px; flex-shrink:0; }

.empty-slot {
  border:1px dashed var(--border); border-radius:12px; padding:16px 18px;
  color:var(--text2); font-size:13px; text-align:center;
}
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="index.html">← กลับ</a>
  <div class="header-title">🗺️ งานสำรวจระบบจำหน่าย</div>
</div>

<div class="menu-wrap">
  <a class="menu-card" href="meter-survey.html">
    <div class="menu-icon">📐</div>
    <div class="menu-text">
      <div class="menu-title">สำรวจปรับปรุงมิเตอร์</div>
      <div class="menu-sub">สร้างแผนงาน · บันทึกจุดสำรวจ · แผนที่</div>
    </div>
    <div class="menu-arrow">›</div>
  </a>

  <div class="empty-slot">พื้นที่สำหรับแอปสำรวจเพิ่มเติมในอนาคต</div>
</div>

</body>
</html>
